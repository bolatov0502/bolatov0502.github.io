<html lang="kk">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Layout: one 760px column. Home lists the three test blocks with progress rails; a quiz run is one card with answers as full-width rows and a sticky action bar. */
:root{
  --bg:#f3f7f6; --surface:#ffffff; --ink:#12302f; --muted:#5a7270; --line:#d3dfdd;
  --accent:#0e6b66; --accent-ink:#ffffff; --accent-soft:#dbeeec;
  --good:#1c7541; --good-soft:#def2e5; --bad:#b0352a; --bad-soft:#fbe3e0; --warn:#8a5f00; --warn-soft:#faefd0;
  --display:'Unbounded','Golos Text',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1918; --surface:#122423; --ink:#e3eeec; --muted:#93aaa7; --line:#27403e;
    --accent:#4dc4b8; --accent-ink:#06211f; --accent-soft:#173b38;
    --good:#5acb8c; --good-soft:#143423; --bad:#f1877c; --bad-soft:#41201c; --warn:#e4b74f; --warn-soft:#3a2f12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1918; --surface:#122423; --ink:#e3eeec; --muted:#93aaa7; --line:#27403e;
  --accent:#4dc4b8; --accent-ink:#06211f; --accent-soft:#173b38;
  --good:#5acb8c; --good-soft:#143423; --bad:#f1877c; --bad-soft:#41201c; --warn:#e4b74f; --warn-soft:#3a2f12;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px}
h1,h2,p,ol,ul{margin:0}
ol{padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font:700 30px/1.15 var(--display);text-wrap:balance;letter-spacing:-.01em}
.h1s{font:700 21px/1.25 var(--display)}
.h2{font:600 13px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.lead{color:var(--muted);max-width:62ch}
.hero,.thead{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.summary,.subj{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.subs{display:flex;flex-direction:column;gap:12px}
.subj .tt b{font:700 18px/1.25 var(--display)}
.meter{display:flex;flex-direction:column;gap:6px}
.meter-top{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.meter-top b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;min-height:44px;text-align:left}
.btn:hover:not(:disabled),.mode:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled,.mode:disabled{opacity:.5;cursor:default}
.btn.big{padding:13px 22px;font-size:16px}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.mode{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:64px}
.mode b{font-weight:600}
.mode i{font-style:normal;color:var(--muted);font-size:13.5px}
.topic,.sec{width:100%;text-align:left;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.topic:hover:not(:disabled),.sec:hover{border-color:var(--accent)}
.topic:disabled{opacity:.6;cursor:default}
.num{font:700 15px/1 var(--display);color:var(--accent);min-width:38px;font-variant-numeric:tabular-nums}
.tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tt b{font-weight:600;overflow-wrap:anywhere}
.tt i{font-style:normal;color:var(--muted);font-size:14px}
.tt small{color:var(--muted);font-size:13px}
.tt .bar{margin-top:5px}
.pc{font:700 14px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--muted);min-width:44px;text-align:right}
.chip{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.part{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.go{color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap}
.how{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.how summary{font-weight:600;cursor:pointer}
.how ul{padding-left:20px;margin-top:10px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:15px}
footer{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--line);padding-top:14px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
/* quiz run */
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qtop .ttl{flex:1;min-width:0;font-weight:600;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.cnt{font:700 13px/1 var(--display);font-variant-numeric:tabular-nums}
.score{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.score .g{color:var(--good)} .score .b{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.re{background:var(--warn-soft);color:var(--warn)}
.psg{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15.5px}
.psg summary{font-weight:600;cursor:pointer;color:var(--muted);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.psg div{max-height:42vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.stem{font-size:19px;line-height:1.4;font-weight:600;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:14.5px}
.ru{color:var(--muted);font-size:15px;border-left:3px solid var(--line);padding-left:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;display:flex;align-items:flex-start;gap:12px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default;opacity:1}
.box{width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;flex:none;margin-top:2px;display:grid;place-items:center;font-size:13px;line-height:1;color:var(--surface)}
.let{font:700 13px/1.6 var(--display);color:var(--muted);min-width:16px}
.otx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.ob{color:var(--muted);font-size:14px}
.mk{font-weight:700;font-size:13.5px;white-space:nowrap}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .box{background:var(--accent);border-color:var(--accent)}
.opt.sel .box::after{content:"✓";color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .let,.opt.right .mk{color:var(--good)} .opt.right .box{background:var(--good);border-color:var(--good)}
.opt.miss{border-color:var(--good);border-style:dashed}
.opt.miss .let,.opt.miss .mk{color:var(--good)} .opt.miss .box{border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .let,.opt.wrong .mk{color:var(--bad)} .opt.wrong .box{background:var(--bad);border-color:var(--bad)}
.opt.dim .oa{color:var(--muted)}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.part{background:var(--warn-soft);border-color:var(--warn)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fbh{font-weight:700}
.fb.good .fbh{color:var(--good)} .fb.part .fbh{color:var(--warn)} .fb.bad .fbh{color:var(--bad)}
.fbnote{font-size:13.5px;color:var(--muted)}
.dock{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:2}
.hint{font-size:13px;color:var(--muted)}
.mist li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.mq{font-weight:600} .ma{color:var(--good);font-weight:600} .me{color:var(--muted);font-size:14.5px}
.xr{color:var(--muted);font-size:15px;border-left:3px solid var(--line);padding-left:10px}
.me.xk{color:var(--ink)} .xtr{padding:2px 0;font-size:14.5px}
.brk{display:grid;grid-template-columns:1fr auto;gap:6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14.5px}
.brk b{font-variant-numeric:tabular-nums;text-align:right}
.sy{display:flex;flex-direction:column;gap:10px;margin-top:10px;font-size:15px}
.sy h3{font:600 13px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.fld{display:flex;flex-direction:column;gap:4px}
.fld span{font-size:13.5px;color:var(--muted)}
.fld input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.fld input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.systat{color:var(--muted)} .syerr{color:var(--bad)}
@media (max-width:420px){h1{font-size:24px}.stem{font-size:17.5px}.pc{display:none}.go{display:none}}
/* узкий экран: название серии уходит на свою строку, пометки «верно / лишний / пропущен» — под текст варианта */
@media (max-width:560px){.qtop{gap:6px 12px}.qtop .link{margin-right:auto}.qtop .ttl{order:5;flex-basis:100%}
  .opt.mo{flex-wrap:wrap}.opt.mo .mk{flex-basis:100%;margin:-4px 0 0 60px}}
@media (hover:none){.kbd{display:none}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>

алды."},{"i":"u59ib0","q":"Аморфты кремнеземнің (диатомит, трепел, микрокремнезем) кристалдық кварцтан айырмашылығы неде?","r":"Чем аморфный кремнезём (диатомит, трепел, микрокремнезём) отличается от кристаллического кварца?","o":[["әкті кәдімгі температурада байланыстырады","связывает известь при обычной температуре"],["әкпен тек автоклавта ғана әрекеттеседі","реагирует с известью только в автоклаве"],["белгілі бір тұрақты температурада балқиды","плавится при определённой постоянной температуре"],["суда толық ериді","полностью растворяется в воде"],["тығыздығы болаттан жоғары","плотность выше, чем у стали"]],"e":"Аморфное вещество химически активнее: оно служит активной минеральной добавкой к цементу. Кристаллический кварц реагирует с известью только в автоклаве.","x":"Аморфты зат химиялық жағынан активтірек: ол цементке активті минералды қоспа болады. Кристалды кварц әкпен тек автоклавта әрекеттеседі."},{"i":"13t5wy5","q":"Бір заттың әртүрлі пішінде кристалдана алуы","r":"Способность одного вещества кристаллизоваться в разных формах","o":[["полиморфизм","полиморфизм"],["анизотропия","анизотропия"],["изотропия","изотропия"],["когезия","когезия"],["дисперстілік","дисперсность"]],"e":"Полиморфизм. Пример: кварц при 573 °C переходит в другую модификацию с увеличением объёма.","x":"Полиморфизм. Мысалы: кварц 573 °C-та көлемі ұлғая отырып басқа модификацияға ауысады."},{"i":"omjble","q":"Кварц қай температурада көлемі ұлғая отырып бір түрден екінші түрге ауысады?","r":"При какой температуре кварц переходит из одной модификации в другую с увеличением объёма?","o":[["573 °C",""],["100 °C",""],["900 °C",""],["1450 °C",""],["1710 °C",""]],"e":"573 °C. Из-за этого трескаются обожжённые изделия и бетон при пожаре. 1710 °C — температура плавления кварца.","x":"573 °C. Осыдан күйдірілген бұйымдар мен өрт кезіндегі бетон жарылады. 1710 °C — кварцтың балқу температурасы."},{"i":"x2vd2p","q":"Беріктігі мен қаттылығы жоғары, қиын балқитын заттарға (алмаз, кварц) қандай байланыс тән аша тығыздық","средняя плотность"],["үйінді тығыздық","насыпная плотность"],["салыстырмалы тығыздық","относительная плотность"],["кеуектілік","пористость"]],"e":"Истинная плотность ρ = m/Vа. Определяют на тонко размолотой высушенной пробе (прибор Ле Шателье, пикнометр).","x":"Шынайы тығыздық ρ = m/Vа. Ұсақ ұнтақталған, кептірілген сынамада анықталады (Ле Шателье аспабы, пикнометр)."},{"i":"1p09tzu","q":"Табиғи күйдегі, кеуектерімен бірге алынған материалдың көлем бірлігінің массасы","r":"Масса единицы объёма материала в естественном состоянии, вместе с порами","o":[["орташа тығыздық","средняя плотность"],["шынайы тығыздық","истинная плотность"],["үйінді тығыздық","насыпная плотность"],["тығыздық коэффициенті","коэффициент плотности"],["қуыстылық","пустотность"]],"e":"Средняя плотность ρm = m/Vе — с порами. Объём образца находят по размерам или гидростатическим взвешиванием.","x":"Орташа тығыздық ρm = m/Vе — кеуектерімен бірге. Үлгінің көлемі өлшемдері бойынша немесе гидростатикалық өлшеумен табылады."},{"i":"1wu32s6","q":"Еркін үйілген сусымалы материалдың түйірлердегі кеуектерімен және түйірлер арасындағы қуыстарымен бірге алынған көлем бірлігінің массасы","r":"Масса единицы объёма свободно насыпанного сыпучего материала вместе с порами в зёрнах и пустотами между зёрнами","o":[["үйінді тығыздық","насыпная плотность"],["шынайы тығыздық","истинная плотность"],["орташа тығыздық","средняя плотность"],["салыстырмалы тығыздық","относительная плотность"],["меншікті бет","удельная поверхность"]],"e":"Насыпная плотность ρн = m/Vн — для песка, щебня, цемента.","x":"Үйінді тығыздық ρн = m/Vн — құм, жарықшақ тас, цемент үшін."},{"i":"18cvu9l","q":"Бір материалдың тығыздықтары арасындағы дұрыс арақатынас қайсы?","r":"Какое соотношение между плотностями одного материала верное?","o":[["шынайы ≥ орташа > үйінді","истинная ≥ средняя > насыпная"],["үйінді > орташа > шынайы","насыпная > средняя > истинная"],["орташа > шынайы > үйінді","средняя > истинная > насыпная"],["шынайы = орта 8","q":"Сусымалы материал көлемінің түйірлер арасындағы қуыстарға келетін үлесі","r":"Доля объёма сыпучего материала, приходящаяся на пустоты между зёрнами","o":[["қуыстылық","пустотность"],["кеуектілік","пористость"],["үйінді тығыздық","насыпная плотность"],["түйіршіктік құрам","зерновой состав"],["гигроскопиялық","гигроскопичность"]],"e":"Пустотность — қуыстылық. Так же называют долю пустот в пустотелых изделиях (кирпич, блоки, плиты).","x":"Қуыстылық — орысша «пустотность». Қуыс бұйымдардағы (кірпіш, блоктар, плиталар) қуыстардың үлесі де осылай аталады."},{"i":"gb3t51","q":"Құм мен жарықшақ тастың қуыстылығы әдетте қанша?","r":"Какова обычно пустотность песка и щебня?","o":[["35–45 %",""],["1–5 %",""],["10–15 %",""],["60–70 %",""],["90–95 %",""]],"e":"35–45 %. Хорошо подобранный песок с зёрнами разных размеров — 30–38 %.","x":"35–45 %. Түйірлерінің өлшемі әртүрлі, жақсы таңдалған құмда — 30–38 %."},{"i":"18ww6p5","q":"Кірпіштің орташа тығыздығы 1750 кг/м³, шынайы тығыздығы 2,5 г/см³. Кеуектілігі қанша?","r":"Средняя плотность кирпича 1750 кг/м³, истинная 2,5 г/см³. Какова пористость?","o":[["30 %",""],["70 %",""],["43 %",""],["17,5 %",""],["25 %",""]],"e":"2,5 г/см³ = 2500 кг/м³. Пористость = (1 − 1750/2500)·100 = 30 %. А 70 % — это коэффициент плотности.","x":"2,5 г/см³ = 2500 кг/м³. Кеуектілік = (1 − 1750/2500)·100 = 30 %. Ал 70 % — тығыздық коэффициенті."},{"i":"xfpytv","q":"Материалдың орташа тығыздығы 2000 кг/м³, шынайы тығыздығы 2500 кг/м³. Тығыздық коэффициенті қанша?","r":"Средняя плотность 2000 кг/м³, истинная 2500 кг/м³. Чему равен коэффициент плотности?","o":[["0,8",""],["0,2",""],["1,25",""],["0,5",""],["4,5",""]],"e":"Kт = ρm/ρ = 2000/2500 = 0,8; пористость при этом 20 %.","x":"Kт = ρm/ρ = 2000/2500 = 0,8; бұл кезде кеуектілік 20 %."},{"i":"p62bzo","q":"Тығыздық коэффициенті мен кеуектіліктің қосындысы неге тең?","r":"Чему равна сумма коэффициента плотности и пористости?","o":[["бірге (100 %)","единице (100 %)"],["нөлге","нулю"],["шынайы тығыздыққа" кезде бетке ақ дақ болып шығып, бұйымның сыртқы түрін бұзады","при сушке выходят на поверхность белыми налётами и портят внешний вид"],["саздың иленгіштігін тым арттырып, кептіргенде бұйымды қатты шөктіреді","слишком повышают пластичность, и изделие сильно усаживается при сушке"],["күйдіру температурасын көтереді","повышают температуру обжига"]],"e":"Это «дутики». Красный цвет дают оксиды железа, белые налёты (высолы) — растворимые соли.","x":"Бұлар — «дутиктер». Қызыл түсті темір оксидтері, ақ дақтарды (тұз шығуын) еритін тұздар береді."},{"i":"1bb07gm","q":"Саздың сумен қамыр беріп, күш әсерінен жарылмай кез келген пішінге келу және оны сақтау қабілеті","r":"Способность глины с водой давать тесто, которое под нагрузкой принимает любую форму без трещин и сохраняет её","o":[["иленгіштік (пластикалық)","пластичность"],["пісу (тығыздалып қатаю)","спекаемость (уплотнение и упрочнение)"],["шөгу (көлемнің кішіреюі)","усадка (уменьшение объёма)"],["отқа беріктік","огнеупорность"],["байланыстыру қабілеті","связующая способность"]],"e":"Пластичность — иленгіштік; мера — число пластичности: разность влажностей на границе текучести и на границе раскатывания.","x":"Пластичность — иленгіштік; өлшемі — иленгіштік саны: аққыштық шегіндегі және жаюға болатын шектегі ылғалдылықтардың айырмасы."},{"i":"7meer8","q":"Иленгіштік саны 25-тен артық саздар қалай аталады?","r":"Как называют глины с числом пластичности больше 25?","o":[["иленгіштігі жоғары («майлы») саздар","высокопластичные («жирные»)"],["иленгіштігі аз («арық») саздар","малопластичные («тощие»)"],["иленгіштігі орташа (қалыпты) саздар","среднепластичные (обычные)"],["отқа берік (1580 °C-тан жоғары) саздар","огнеупорные (выше 1580 °C)"],["оңай балқитын саздар","легкоплавкие"]],"e":"Больше 25 — высокопластичные; 15–25 — средне-; 7–15 — умеренно пластичные; меньше 7 — малопластичные («тощие»).","x":"25-тен артық — иленгіштігі жоғары; 15–25 — орташа; 7–15 — шамалы; 7-ден кем — иленгіштігі аз («арық») саздар."},{"i":"11sl344","q":"Саздың толық шөгуі неден тұрады?","r":"Из чего складывается полная усадка глины?","o":[["ауада шөгу (кептіргенде) мен отта шөгудің (күйдіргенде) қосындысынан","из воздушной (при сушке) и огневой (при обжиге) усадки"],["тек ауада шөгуден, өйткені отта шөгу есепке алынбайды","только из воздушной усадки: огневая не учитывается"],["тек отта шөгуден, өйткені ауада шөгу кептіргенде жойылып кетеді","только из огневой усадки: воздушная исчезает при сушке"],["қамыр илегендегі ісіну мен күйдіргендегі отта шөгудің арасындағы айырмадан","из разности между набуханием при замесе и огневой усадкой при обжиге"],["су сіңіргіштік пен табиғи ылғалдылықтың қосындысынан","из суммы водопоглощения и естественной влажности"]],"e":"Воздушная усадка 2–10 %, огневая 2–8 %; полная — их сумма.","x":"Ауалық шөгу 2–10 %, оттық шөгу 2–8 %; толық шөгу — олардың қосындысы."},{"i":"1k6wltv","q":"Кірпіш, черепица, керамзит қандай саздардан жасалады?","r":"Из каких глин делают кирпич, черепицу, керамзит?","o":[["оңай балқитын саздардан (1350 °C-тан төмен)","из легкоплавких (ниже 1350 °C)"],["қиын балқитын саздардан (1350–1580 °C)","из тугоплавких (1350–1580 °C)"],["отқа берік саздардан (1580 °C-тан жоғары балқитын)","из огнеупорных (плавятся выше 1580 °C)"],["каолиндерден (таза ақ саздардан)","из каолинов (чистых белых глин)"],["бентониттен","из бентонита"]],"e":"Легкоплавкие — кирпич, черепица, керамзит; тугоплавкие — плитки для полов, трубы, клинкер; огнеупорные — огнеупоры, фарфор, фаянс.","x":"Оңай балқитын саздар — кірпіш, жабынқыш, керамзит; қиын балқитындар — еден плиткалары, құбырлар, клинкер; отқа беріктер — отқа берік бұйымдар, фарфор, фаянс."},{"i":"zda9x2","q":"Майлы саздардың иленгіштігі мен шөгуін төмендететін қоспалар (кварц құмы, шамот, шлактар)","r":"Добавки, снижающие пластичность и усадку жирных глин (кварцевый песок, шамот, шлаки)","o":[["арықтатқыш заттар","отощающие добавки"],["жанып кететін қоспалар","выгорающие добавки"],["балқытқыштар","плавни"],["иленгіштікті арттыратын қоспалар","пластифицирующие добавки"],["газ түзетін қоспалар","газообразующие добавки"]],"e":"Отощающие — арықтатқыш заттар: уменьшают трещины при сушке.","x":"Отощающие — арықтатқыш заттар: кептіргендегі жарықтарды азайтады."},{"i":"8a9ddz","q":"Күйдіргенде жанып, орнында кеуек қалдыратын қоспалар","r":"Добавки, которые при обжиге выгорают и оставляют поры","o":[["ағаш үгіндісі, көмір, шымтезек","опилки, уголь, торф"],["кварц құмы, шамот, дегидратталған саз","кварцевый песок, шамот, дегидратированная глина"],["дала шпаты, тальк, доломит","полевой шпат, тальк, доломит"],["бентонит","бентонит"],["шыны сынықтары","стеклобой"]],"e":"Выгорающие добавки делают черепок легче и менее теплопроводным.","x":"Жанып кететін қоспалар бұйымды жеңілірек етеді және жылу өткізгіштігін азайтады."},{"i":"1o1wb7r","q":"Пісу температурасын төмендетіп, қыш денені тығыздайтын қоспалар (дала шпаттары, темір кені, шыны сынықтары)","r":"Добавки, понижающие температуру спекания и уплотняющие черепок (полевые шпаты, железная руда, стеклобой)","o":[["балқытқыштар","плавни"],["арықтатқыш заттар","отощающие добавки"],["жанып кететін қоспалар","выгорающие добавки"],["сиккативтер","сиккативы"],["антипирендер","антипирены"]],"e":"Плавни — балқытқыштар.","x":"Плавни — балқытқыштар."},{"i":"1daukbc","q":"Бұйым бетіндегі күйдірумен бекітілген жұқа шыны тәрізді жабын","r":"Тонкое стекловидное покрытие на поверхности изделия, закреплённое обжигом","o":[["глазурь","глазурь"],["ангоб","ангоб"],["эмаль","эмаль"],["сылақ","штукатурка"],["грунт","грунтовка"]],"e":"Глазурь делает черепок водонепроницаемым, гладким и декоративным. Ангоб — тонкий матовый слой белой или цветной глины.","x":"Глазурь бұйымды су өткізбейтін, тегіс әрі әсем етеді. Ангоб — ақ немесе түсті саздың жұқа күңгірт қабаты."}]},{"id":"13-2","kz":"Керамика: технологиясы","ru":"Керамика: технология","q":[{"i":"14lixo8","q":"Керамика бұйымдарын өндірудің негізгі операцияларының дұрыс реті","r":"Правильный порядок основных операций производства керамики","o":[["массаны дайындау → қалыптау → кептіру → күйдіру","подготовка массы → формование → сушка → обжиг"],["қалыптау → күйдіру → кептіру → массаны дайындау","формование → обжиг → сушка → подготовка массы"],["күйдіру → қалыптау → кептіру","обжиг → формование → сушка"],["кептіру → массаны дайындау → күйдіру → қалыптау","сушка → подготовка → обжиг → формование"],["балқыту → қалыптау → жасыту","плавление → формование → отжиг"]],"e":"Сначала сушка, потом обжиг: сырой сырец в печи растрескается от бурного парообразования.","x":"Алдымен кептіру, содан кейін күйдіру: шикі бұйым пеште қарқынды бу түзілуден жарылып кетеді."},{"i":"gmsol0","q":"Пластикалық тәсілмен қалыптағанда массаның ылғалдылығы қанша?","r":"Какова влажность массы при пластическом формовании?","o":[["18–25 %",""],["8–12 %",""],["2–6 %",""],["35–45 %",""],["50–70 %",""]],"e":"Пластический способ — 18–25 %; жёсткий — 13–18 %; полусухое прессование — 8–12 %; сухое — 2–6 %; шликерное литьё — 35–45 %.","x":"Пластикалық тәсіл — 18–25 %; қатаң тәсіл — 13–18 %; жартылай құрғақ престеу — 8–12 %; құрғақ престеу — 2–6 %; шликерлік құю — 35–45 %."},{"i":"iqus76","q":"Прес-ұнтақты қалыптарда 15–40 МПа қысыммен престеу (массаның ылғалдылығы 8–12 %)","r":"Прессование пресс-порошка в формах под давлением 15–40 МПа (влажность массы 8–12 %)","o":[["жартылай құрғақ престеу","полусухое прессование"],["пластикалық қалыптау тәсілі","способ пластического формования"],["шликерлі құю","шликерное литьё"],["экструзия","экструзия"],["центрифугалау","центрифугирование"]],"e":"Полусухое прессование даёт изделия точной формы с гладкими гранями; годятся малопластичные глины.","x":"Жартылай құрғақ престеу қырлары тегіс, пішіні дәл бұйымдар береді; иленгіштігі аз саздар да жарайды."},{"i":"1ryxn28","q":"Сұйық массаны (ылғалдылығы 35–45 %) кеуекті гипс қалыптарға құю тәсілі","r":"Способ, при котором жидкую массу (влажность 35–45 %) заливают в пористые гипсовые формы","o":[["шликерлі құю","шликерное литьё"],["пластикалық тәсіл","пластический способ"],["жартылай құрғақ престеу","полусухое прессование"],["құрғақ престеу","сухое прессование"],["қатаң тәсіл","жёсткий способ"]],"e":"Шликерное литьё — санитарно-технические изделия, плитки.","x":"Шликерлік құю — санитарлық-техникалық бұйымдар, плиткалар."},{"i":"17yj9my","q":"Шикі бұйым күйдіру алдында қандай ылғалдылыққа дейін кептіріледі?","r":"До какой влажности сушат сырец перед обжигом?","o":[["4–6 %",""],["18–25 %",""],["12–15 %",""],["30 %",""],["0 %",""]],"e":"До 4–6 %, медленно и равномерно, от одних до трёх суток.","x":"4–6 %-ке дейін, баяу әрі біркелкі, бір тәуліктен үш тәулікке дейін."},{"i":"d1na1b","q":"Күйдіргенде 450–800 °C аралығында не болады?","r":"Что происходит при обжиге в интервале 450–800 °C?","o":[["сазды минералдар химиялық байланысқан суын жоғалтады, саз иленгіштігін біржола жоғалтады","глинистые минералы теряют химически связанную воду, глина навсегда теряет пластичность"],["бос және физикалық байланысқан су буланады, бұйым кебеді","испаряется свободная и физически связанная вода, изделие сохнет"],["муллит түзіліп, сұйық фаза пайда болады, қыш дене тығыздалып піседі, беріктігі күрт артады","образуется муллит, появляется жидкая фаза, черепок спекается, прочность резко растёт"],["бұйым толық балқып, пішінін жоғалтады, шыны тәрізді массаға айналады","изделие полностью плавится, теряет форму и превращается в стекловидную массу"],["глазурь балқып, бұйым бетінде шыны тәрізді тығыз қабат түзеді","глазурь плавится и образует на поверхности плотный стекловидный слой"]],"e":"Каолинит переходит в метакаолинит Al₂O₃·2SiO₂. Свободная вода уходит при 100–200 °C, муллит образуется выше 1000 °C.","x":"Каолинит метакаолинитке Al₂O₃·2SiO₂ айналады. Бос су 100–200 °C-та кетеді, муллит 1000 °C-тан жоғарыда түзіледі."},{"i":"nfj9c0","q":"1000 °C-тан жоғары температурада түзіліп, қыш денеге беріктік пен термиялық төзімділік беретін минерал","r":"Минерал, который образуется выше 1000 °C и придаёт черепку прочность и термостойкость","o":[["муллит 3Al₂O₃·2SiO₂","муллит"],["каолинит Al₂O₃·2SiO₂·2H₂O","каолинит Al₂O₃·2SiO₂·2H₂O"],["кальцит CaCO₃","кальцит CaCO₃"],["алит 3CaO·SiO₂","алит 3CaO·SiO₂"],["эттрингит","эттрингит"]],"e":"Муллит образуется из продуктов распада каолинита.","x":"Муллит каолиниттің ыдырау өнімдерінен түзіледі."},{"i":"ymin2b","q":"Кірпіш пен черепица қандай температурада күйдіріледі?","r":"При какой температуре обжигают кирпич и черепицу?","o":[["900–1100 °C",""],["110–180 °C",""],["450–600 °C",""],["1450 °C",""],["1580–1700 °C",""]],"e":"Кирпич и черепица — 900–1100 °C; плитки и трубы — 1000–1250 °C; фарфор — до 1300–1450 °C.","x":"Кірпіш пен жабынқыш — 900–1100 °C; плиткалар мен құбырлар — 1000–1250 °C; фарфор — 1300–1450 °C-қа дейін."},{"i":"kc4ie","q":"Шала күйген кірпіштің белгілері қандай?","r":"Каковы признаки недожжённого кирпича?","o":[["ашық (алқызыл) түсті, соққанда күңгірт дыбыс шығарады, берік емес әрі аязға төзімсіз","светлый (алый), при ударе звучит глухо, непрочен и неморозостоек"],["қара-қоңыр түсті, балқыған, қисайған, өте тығыз, берік, бірақ жылуды жақсы өткізеді","тёмно-бурый, оплавленный, искривлённый, очень плотный и прочный, но хорошо проводит тепло"],["бетінде ақ тұз дақтары бар, бірақ беріктігі мен аязға төзімділігі қалыпты","с белыми солевыми налётами, но прочность и морозостойкость в норме"],["глазурьмен қапталған, соққанда таза шыңылдаған дыбыс шығарады","покрыт глазурью, при ударе издаёт чистый звонкий звук"],["өте жеңіл, суда қалқиды, жылуды нашар өткізеді","очень лёгкий, плавает в воде, плохо проводит тепло"]],"e":"Недожог — светлый, глухой звук, непрочен. Пережог («железняк») — тёмный, оплавленный, очень плотный и теплопроводный.","x":"Шала күйген кірпіш — ақшыл, дыбысы күңгірт, берік емес. Асыра күйген кірпіш («темір кірпіш») — қара, балқыған, өте тығыз әрі жылуды жақсы өткізеді."}]},{"id":"13-3","kz":"Керамика: бұйымдары","ru":"Керамика: изделия","q":[{"i":"18y6z4w","q":"Дара керамикалық кірпіштің өлшемдері қандай?","r":"Каковы размеры одинарного керамическог x":"Болат — 2,14 %-ке дейін көміртек; шойын — 2,14-тен 6,67 %-ке дейін."},{"i":"k4bzz9","q":"Шойынның болаттан айырмашылығы қандай?","r":"Чем чугун отличается от стали?","o":[["қатты әрі морт, жақсы құйылады, бірақ соғылмайды","твёрдый и хрупкий, хорошо льётся, но не куётся"],["пластикалық, жақсы соғылады, илемделеді және пісіріледі","пластичный, хорошо куётся, прокатывается и сваривается"],["көміртегі мөлшері азырақ","в нём меньше углерода"],["тығыздығы судан аз","плотность меньше, чем у воды"],["магнитке тартылмайды","не притягивается магнитом"]],"e":"Чугун идёт на литые детали: трубы, радиаторы, люки, тюбинги. Сталь куётся, прокатывается, сваривается.","x":"Шойыннан құйма бөлшектер жасалады: құбырлар, радиаторлар, люктер, тюбингтер. Болат соғылады, прокатталады, пісіріледі."},{"i":"1hy5tt4","q":"Болаттағы көміртегі мөлшері артқан сайын не болады?","r":"Что происходит с ростом содержания углерода в стали?","o":[["қаттылығы мен беріктігі өседі, пластикалығы мен пісірілгіштігі төмендейді","твёрдость и прочность растут, пластичность и свариваемость падают"],["пластикалығы мен пісірілгіштігі артады, қаттылығы мен беріктігі төмендейді","растут пластичность и свариваемость, падают твёрдость и прочность"],["қаттылығы төмендейді","падает твёрдость"],["механикалық қасиеттері өзгермейді, тек балқу температурасы көтеріледі","механические свойства не меняются, растёт только температура плавления"],["тығыздығы екі есе артады","плотность растёт вдвое"]],"e":"Поэтому в низколегированных строительных сталях углерода оставляют не больше 0,2 % — чтобы сталь хорошо сваривалась.","x":"Сондықтан аз легирленген құрылыс болаттарында көміртек 0,2 %-тен аспайды — болат жақсы пісірілуі үшін."},{"i":"jl3ne1","q":"Шойын қайда және неден балқытылады?","r":"Где и из чего выплавляют чугун?","o":[["домна пешінде темір кенінен, кокстан және флюстен","в доменной печи из железной руды, кокса и флюса"],["оттекті конвертерде болат сынықтары мен ферроқорытпалардан","в кислородном конвертере из стального лома и ферросплавов"],["айналмалы пеште әктас пен саздан","во вращающейся печи из известняка и глины"],["ванналы пеште кварц құмы мен содадан","в ванной печи из кварцевого песка и соды"],["автоклавта әк пен құмнан","в автоклаве из извести и песка"]],"e":"Кокс восстанавливает железо из оксидов, флюс (известняк) переводит пустую породу в шлак. Сталь получают из чугуна в конвертерах, электропечах, мартеновских печах.","x":"Кокс темірді оксидтерден тотықсыздандырады, флюс (әктас) бос жынысты шлакқа айналдырады. Болат шойыннан конвертерлерде, электр пештерінде, мартен пештерінде алынады."},{"i":"4kmh47","q":"Көміртегі түгелдей цементитке (Fe₃C) байланысқан, өте қатты әрі морт шойын","r":"Чугун, в котором весь углерод связан в цементит (Fe₃C); очень твёрдый и хрупкий","o":[["ақ шойын","белый чугун"],["сұр шойын","серый чугун"],["соғылғыш шойын","ковкий чугун"],["беріктігі жоғары шойын","высокопрочный чугун"],["легирленген шойын","легированный чугун"]],"e":"Белый чугун не обрабатывается резанием; идёт в переплавку на сталь и на ковкий чугун.","x":"Ақ шойын кесіп өңделмейді; ол болатқа және соғылғыш шойынға қайта балқытылады."},{"i":"1w3no14","q":"Көміртегінің көп бөлігі графит пластинкалары түрінде болатын, жақсы құйылатын шойын","r":"Чугун, в котором большая часть углерода — в виде пластинок графита; хорошо льётся","o":[["сұр шойын","серый чугун"],["ақ шойын","белый чугун"],["соғылғыш шойын","ковкий чугун"],["беріктігі жоғары шойын","высокопрочный чугун"],["тынық шойын","спокойный чугун"]],"e":"Серый чугун: трубы, радиаторы, станины, люки. В учебнике Руднова описания серого и белого чугуна переставлены — верно как здесь.","x":"Сұр шойын: құбырлар, радиаторлар, станиналар, люктер. Руднов оқулығында сұр және ақ шойынның сипаттамалары орын ауыстырып кеткен — дұрысы осындағыдай."},{"i":"1i5yocy","q":"Графиті шар тәрізді шойын қалай алынады?","r":"Как получают чугун с шаровидным графитом?","o":[["магний қосу арқылы (0,03–0,04 %)","добавкой магния (0,03–0,04 %)"],["ақ шойынды ұзақ жасыту арқылы","длительным отжигом белого чугуна"],["шынықтыру арқылы","закалкой"],["хром қосу арқылы","добавкой хрома"],["көміртегін толық жағу арқылы","полным выжиганием углерода"]],"e":"Это высокопрочный чугун (напорные трубы). Длительным отжигом белого чугуна получают ковкий — с хлопьевидным графитом.","x":"Бұл — беріктігі жоғары шойын (қысымды құбырлар). Ақ шойынды ұзақ жасыту арқылы графиті үлпек тәрізді соғылғыш шойын алынады."},{"i":"1sjsa7e","q":"Соғылғыш шойын туралы қай тұжырым дұрыс?","r":"Какое утверждение о ковком чугуне верно?","o":[["атауы шартты: ол соғылмайды, тек пластикалығы жоғарырақ","название условное: его не куют, у него лишь повышенная пластичность"],["ол балғамен оңай соғылады, сондықтан осылай аталған","он легко куётся молотом, поэтому так и назван"],["онда көміртегі мүлде жоқ, сондықтан ол болатқа жатады","в нём совсем нет углерода, поэтому он относится к сталям"],["ол ең қатты шойын","это самый твёрдый чугун"],["ол тек домна пешінде, ақ шойынды қайта өңдемей алынады","его получают только в доменной печи, без переработки белого чугуна"]],"e":"Ковкий чугун получают длительным отжигом белого; графит хлопьевидный; фитинги, детали арматуры.","x":"Соғылғыш шойын ақ шойынды ұзақ жасыту арқылы алынады; графиті үлпек тәрізді; фитингтер, арматура бөлшектері."}]},{"id":"13-7","kz":"Болаттар: жіктелуі, өңдеу, қасиеттері","ru":"Стали: классификация, обработка, свойства","q":[{"i":"ggo5ey","q":"Аз көміртекті болаттағы көміртегі мөлшері қанша?","r":"Сколько углерода в низкоуглеродистой стали?","o":[["0,25 %-ке дейін","до 0,25 %"],["0,25–0,6 %","0,25–0,6 %"],["0,6 %-тен артық","больше 0,6 %"],["2,14 %-тен артық","больше 2,14 %"],["2,5–10 %","2,5–10 %"]],"e":"Низкоуглеродистые — до 0,25 %; средне- — 0,25–0,6 %; высокоуглеродистые — больше 0,6 %.","x":"Аз көміртекті болаттар — 0,25 %-ке дейін; орташа көміртекті — 0,25–0,6 %; көп көміртекті — 0,6 %-тен көп."},{"i":"ktptnj","q":"Легирлеуші элементтері 2,5 %-ке дейінгі болат қалай аталады?","r":"Как н ы (пористость 40–60 %).","x":"Реакцияның өзіне 18,6 % су керек, ал 50–70 % алынады; артық су буланып, кеуектер қалдырады (кеуектілігі 40–60 %)."},{"i":"rz7kpm","q":"Гипстің маркасындағы сан (мысалы, Г-5) нені білдіреді?","r":"Что означает число в марке гипса (например, Г-5)?","o":[["сумен араластырғаннан 2 сағаттан кейінгі қысу беріктігі, МПа","прочность при сжатии через 2 часа после затворения, МПа"],["қалыпты жағдайда 28 тәулік қатайғаннан кейінгі қысу беріктігі, кгс/см²","прочность при сжатии после 28 суток нормального твердения, кгс/см²"],["ұстасудың басталуы мен аяқталуы арасындағы уақыт, минут","время между началом и концом схватывания, мин"],["ұнтақтық дәрежесі: 0,2 мм електегі қалдық, %","тонкость помола: остаток на сите 0,2 мм, %"],["су сіңіргіштігі, %","водопоглощение, %"]],"e":"Марки Г-2 … Г-25: предел прочности при сжатии в МПа через 2 часа.","x":"Г-2 … Г-25 маркалары: 2 сағаттан кейінгі қысу беріктігінің шегі, МПа-мен."},{"i":"198w8iz","q":"Қалыпты қатаятын гипстің (Б тобы) ұстасу мерзімдері қандай?","r":"Каковы сроки схватывания нормальнотвердеющего гипса (группа Б)?","o":[["басталуы 6 минуттан ерте емес, аяқталуы 30 минуттан кеш емес","начало не раньше 6 мин, конец не позже 30 мин"],["басталуы 2 минуттан ерте емес, аяқталуы 15 минуттан кеш емес","начало не раньше 2 мин, конец не позже 15 мин"],["басталуы 20 минуттан ерте емес","начало не раньше 20 мин"],["басталуы 45 минуттан ерте емес, аяқталуы 10 сағаттан кеш емес","начало не раньше 45 мин, конец не позже 10 ч"],["басталуы 20 минуттан ерте емес, аяқталуы 6 сағаттан кеш емес","начало не раньше 20 мин, конец не позже 6 ч"]],"e":"А — быстротвердеющий (2 и 15 мин); Б — нормальнотвердеющий (6 и 30 мин); В — медленнотвердеющий (начало не раньше 20 мин).","x":"А — тез қатаятын (2 және 15 мин); Б — қалыпты қатаятын (6 және 30 мин); В — баяу қатаятын (басталуы 20 минуттан ерте емес)."},{"i":"2dehtm","q":"Гипс қатайғанда көлемі қалай өзгереді?","r":"Как меняется объём гипса при твердении?","o":[["шамамен 1 %- к сүті","известковое молоко"],["гидравликалық әк","гидравлическая известь"]],"e":"Комовая негашёная известь («кипелка»); в учебнике — «сөнбеген әк». Её либо размалывают, либо гасят.","x":"Кесек сөндірілмеген әк («кипелка»); оқулықта — «сөнбеген әк». Оны не ұнтақтайды, не сөндіреді."},{"i":"13gr41q","q":"Әкті сөндіру реакциясы қайсы?","r":"Какова реакция гашения извести?","o":[["CaO + H₂O → Ca(OH)₂ + жылу","CaO + H₂O → Ca(OH)₂ + тепло"],["CaCO₃ → CaO + CO₂",""],["Ca(OH)₂ + CO₂ → CaCO₃ + H₂O",""],["CaO + CO₂ → CaCO₃",""],["CaO + SiO₂ → CaSiO₃",""]],"e":"Гашение — гидратация оксида кальция: идёт бурно, с выделением тепла (65 кДж/моль).","x":"Сөндіру — кальций оксидінің гидратациясы: қарқынды жүреді, жылу бөлінеді (65 кДж/моль)."},{"i":"mgl0j9","q":"Әкті сөндіргенде көлемі қалай өзгереді?","r":"Как меняется объём извести при гашении?","o":[["2–3 есе ұлғаяды","увеличивается в 2–3 раза"],["1 %-ке ұлғаяды","увеличивается на 1 %"],["9 %-ке ұлғаяды","увеличивается на 9 %"],["екі есе кішірейеді","уменьшается вдвое"],["өзгермейді","не меняется"]],"e":"Вода закипает, куски рассыпаются в тончайший порошок, объём растёт в 2–3 раза.","x":"Су қайнайды, кесектер өте ұсақ ұнтаққа айналады, көлемі 2–3 есе артады."},{"i":"1jezih6","q":"Гидратты әк (үлпек әк) алу үшін қанша су қосылады?","r":"Сколько воды берут, чтобы получить гидратную известь (пушонку)?","o":[["әк массасының 60–80 %-і","60–80 % от массы извести"],["әк массасынан 3–4 есе көп","в 3–4 раза больше массы извести"],["әк массасының 5–10 %-і","5–10 % от массы извести"],["әк массасының 18,6 %-і","18,6 % от массы извести"],["су қосылмайды","вода не нужна"]],"e":"60–80 % (по реакции нужно около 32 %, остальное испаряется) — получается сухой порошок Ca(OH)₂. В 3–4 раза больше массы — известковое тесто.","x":"60–80 % (реакцияға шамамен 32 % керек, қалғаны буланады) — Ca(OH)₂ құрғақ ұнтағы алынады. Су массадан 3–4 есе көп болса — әк қамыры."},{"i":"6jzxi","q":"MgO мөлшері 5 %-ке дейінгі ауа әгі қалай аталады?","r":"Как называют воз ","r":"Свойство, характеризующее способность бетонной смеси заполнять форму и образовывать после уплотнения плотную однородную массу","o":[["ыңғайлы төселімділік","удобоукладываемость"],["су ұстау қабілеті","водоудерживающая способность"],["аязға және суға төзімділік","морозо- и водостойкость"],["тығыздық","плотность"],["беріктік","прочность"]],"e":"Задание из образца НЦТ (там слово набрано как «ынғайлы»). Остальные варианты — свойства затвердевшего бетона.","t":1,"x":"ҰТО үлгісіндегі тапсырма (онда бұл сөз «ынғайлы» деп терілген). Қалған нұсқалар — қатайған бетонның қасиеттері."},{"i":"1cionmu","q":"Бетондағы цемент қамыры қандай қызмет атқарады?","r":"Какую роль играет цементное тесто в бетоне?","o":[["түйірлерді қаптап, қуыстарды толтырады, араласпаға жылжымалылық береді, қатайғанда түйірлерді желімдейді","обволакивает зёрна, заполняет пустоты, придаёт смеси подвижность, а затвердев, склеивает зёрна"],["бетонның қатаң қаңқасын құрап, шөгу мен жылжығыштықты азайтады, серпімділік модулін арттырады, цементті үнемдейді","образует жёсткий скелет бетона, уменьшает усадку и ползучесть, повышает модуль упругости, экономит цемент"],["тек бетонның түсі мен сыртқы түрін береді, беріктікке мүлде әсер етпейді","только задаёт цвет и внешний вид бетона, на прочность совсем не влияет"],["бетон көлемінің 80–85 %-ін алып, оның тығыздығы мен жылу өткізгіштігін анықтайды","занимает 80–85 % объёма бетона и определяет его плотность и теплопроводность"],["созылу кернеулерін қабылдап, конструкцияда болат арматураны толық алмастырады","воспринимает растягивающие напряжения и полностью заменяет стальную арматуру"]],"e":"Жёсткий скелет образуют заполнители, они же занимают до 80–85 % объёма.","x":"Қатаң қаңқаны толтырғыштар құрайды, олар көлемнің 80–85 %-іне дейін алады."},{"i":"vi5qul","q":"Толтырғыштар бетон көлемінің қанша бөлігін алады?","r":"Какую часть объёма бетона занимают заполнители?","o":[["80–85 %-ке дейін","до 80–85 %"],["10–15 %-ке дейін","до 10–15 %"],["30–40 %-ке дейін","до 30–40 %"],["3–5 %-ке дейін","до 3–5 %"],["99 %-ке дейін","до 99 %"]],"e":"До 80–85 %: они образуют скелет, уменьшают усадку и ползучесть, экономят цемент.","x":"80–85 %-ке дейін: олар қаңқа құрайды, шөгу мен жылжығыштықты азайтады, цементті үнемдейді."},{"i":"13mbg1w","q":"Ауыр бетонның орташа тығыздығы қандай (бетон технологиясы оқулықтары бойынша)?","r":"Какова средняя плотность тяжёлого бетона (по учебникам технологии бетона)?","o":[["2200–2500 кг/м³",""],["2500 кг/м³-ден артық","больше 2500 кг/м³"],["500–1800 кг/м³",""],["500 кг/м³-ден кем","меньше 500 кг/м³"],["1800–2200 кг/м³",""]],"e":"Тяжёлый — 2200–2500 (у Руднова 2100–2500); облегчённый — 1800–2200; лёгкий — 500–1800; особо тяжёлый — больше 2500 кг/м³.","x":"Ауыр бетон — 2200–2500 (Рудновта 2100–2500); жеңілдетілген — 1800–2200; жеңіл — 500–1800; ерекше ауыр — 2500 кг/м³-тен артық."},{"i":"11x3qwq","q":"Өте ауыр бетонның орташа тығыздығы қандай?","r":"Какова средняя плотность особо тяжёлого бетона?","o":[["2500 кг/м³-ден артық","больше 2500 кг/м³"],["2200–2500 кг/м³",""],["1800–2200 кг/м³",""],["1200–1800 кг/м³",""],["500 кг/м³-ден кем","меньше 500 кг/м³"]],"e":"Больше 2500 кг/м³ — на барите, магнетите, чугунном скрапе; эта граница одинакова у всех авторов.","x":"2500 кг/м³-тен артық — барит, магнетит, шойын скрабында; бұл шек барлық авторда бірдей."},{"i":"kfaos5","q":"Бетон араласпасының жылжымалылығы немен бағаланады?","r":"Чем оценивают подвижность бетонной смеси?","o":[["стандартты конустың сантиметрмен алынған шөгуімен (П1–П5)","осадкой стандартного конуса в сантиметрах (П1–П5)"],["техникалық вискозиметрдегі секундпен алынған дірілдету уақытымен (Ж1–Ж4)","временем вибрирования в техническом вискозиметре, в секундах (Ж1–Ж4)"],["300 г конустың ену тереңдігімен (Пк1–Пк4)","глубиной погружения конуса 300 г (Пк1–Пк4)"],["пенетрация градустарымен","градусами пенетрации"],["Вика инесінің ену тереңдігімен","глубиной погружения иглы Вика"]],"e":"Подвижность — осадка конуса, марки П1–П5; жёсткость — время вибрирования, марки Ж1–Ж4. Пк — это подвижность растворной смеси.","x":"Жылжымалылық — конустың шөгуі, П1–П5 маркалары; қатаңдық — дірілдету уақыты, Ж1–Ж4 маркалары. Пк — ерітінді араласпасының жылжымалылығы."},{"i":"1qx7htb","q":"Бетонның B, F, W, D белгілері нені білдіреді?","r":"Что означают обозначения B, F, W, D у бетона?","o":[["B — беріктік класы, F — аязға төзімділік, W — су өткізбеушілік, D — орташа тығыздық","B — класс по прочности, F — морозостойкость, W — водонепроницаемость, D — средняя плотность"],["B — су өткізбеушілік маркасы, F — беріктік класы, W — орташа тығыздық, D — аязға төзімділік","B — марка по водонепроницаемости, F — класс прочности, W — средняя плотность, D — морозостойкость"],["B — тығыздық, F — жылжымалылық, W — ылғалдылық, D — қаттылық","B — плотность, F — подвижность, W — влажность, D — твёрдость"],["бәрі беріктік маркалары","всё это марки по прочности"],["B — байланыстырғыш түрі, F — фракция, W — су шығыны, D — қоспа","B — вид вяжущего, F — фракция, W — расход воды, D — добавка"]],"e":"Класс B в МПа (или марка M в кгс/см²), F — циклы, W — давление воды, D — плотность.","x":"B класы МПа-мен (немесе M маркасы кгс/см²-мен), F — циклдер, W — су қысымы, D — тығыздық."},{"i":"161izmi","q":"Бетон беріктігінің заңы бойынша беріктік неге байланысты?","r":"От чего зависит прочность по закону прочности бетона?","o":[["цементтің активтілігіне және цемент-су қатынасына","от активности цемента и цементно-водного отношения"],["тек толтырғыштың түсі мен түйірлерінің пішініне","только от цвета и формы зёрен заполнителя"],["тек араластыру уақыты мен дірілдету ұзақтығына","только от времени перемешивания и длительности вибрирования"],["тек қалыптың пішіні мен өлшемдеріне","только от формы и размеров опалубки"],["тек ауа температурасы мен ылғалдылығына","только от температуры и влажности воздуха"]],"e":"Rб = A·Rц·(Ц/С − 0,5): чем активнее цемент и чем меньше воды на единицу массы цемента, тем выше прочность. A — коэффициент качества заполнителей (0,55–0,65).","x":"Rб = A·Rц·(Ц/С − 0,5): цемент неғұрлым активті және цемент массасының бірлігіне су неғұрлым аз болса, беріктік соғұрлым жоғары. A — толтырғыштар сапасының коэффициенті (0,55–0,65)."},{"i":"1a6kqt1","q":"Бетон өндірісінің шамамен 65 %-і қандай байланыстырғышта шығарылады?","r":"На каком вяжущем выпускают около 65 % всего бетона?","o":[["портландцементте","на портландцементе"],["шлакты портландцементте","на шлакопортландцементе"],["әкте","на извести"],["гипсте","на гипсе"],["сұйық шыныда","на жидком стекле"]],"e":"Около 65 % — на портландцементе и ещё 20–25 % — на шлакопортландцементе.","x":"Шамамен 65 % — портландцементте және тағы 20–25 % — шлакты портландцементте."},{"i":"eu9xja","q":"Бетонның құрылымы бойынша түрлері қандай?","r":"Каковы виды бетона по структуре?","o":[["тығыз, кеуектендірілген, ұялы, ірі кеуекті","плотная, поризованная, ячеистая, крупнопористая"],["аса ауыр, ауыр, жеңілдетілген, жеңіл, өте жеңіл","особо тяжёлые, тяжёлые, облегчённые, лёгкие, особо лёгкие"],["цементті, силикатты, гипсті, шлак-сілтілі","цементные, силикатные, гипсовые, шлакощелочные"],["құрама, монолитті және құрама-монолитті","сборные, монолитные и сборно-монолитные"],["қарапайым, күрделі","простые, сложные"]],"e":"По структуре: плотная, поризованная, ячеистая, крупнопористая. Остальные варианты — деление по плотности, вяжущему и т. д.","x":"Құрылымы бойынша: тығыз, кеуектендірілген, ұялы, ірі кеуекті. Қалған нұсқалар — тығыздығы, байланыстырғышы және т. б. бойынша бөліну."}]},{"id":"15-2","kz":"Бетонға арналған толтырғыштар","ru":"Заполнители для бетона","q":[{"i":"oel3nz","q":"Бетонның ұсақ толтырғышы — құмның түйір ірілігі қандай?","r":"Какова крупность зёрен мелкого заполнителя бетона — песка?","o":[["0,16-дан 5 мм-ге дейін","от 0,16 до 5 мм"],["5-тен 70 мм-ге дейін","от 5 до 70 мм"],["0,001-ден 0,16 мм-ге дейін","от 0,001 до 0,16 мм"],["10-нан 20 мм-ге дейін","от 10 до 20 мм"],["70 мм-ден ірі","крупнее 70 мм"]],"e":"Песок — 0,16–5 мм; крупный заполнитель — зёрна крупнее 5 мм.","x":"Құм — 0,16–5 мм; ірі толтырғыш — 5 мм-ден ірі түйірлер."},{"i":"114jk6e","q":"Құмның түйіршіктік құрамы қандай електерден елеу арқылы анықталады?","r":"На каких ситах определяют зерновой состав песка?","o":[["5; 2,5; 1,25; 0,63; 0,315; 0,16 мм",""],["70; 40; 20; 10; 5; 2,5; 1,25; 0,63 мм","70; 40; 20; 10; 5; 2,5; 1,25; 0,63 мм"],["0,08; 0,04; 0,02 мм",""],["150; 100; 70,7 мм",""],["10; 20; 40 мм",""]],"e":"Сита 5; 2,5; 1,25; 0,63; 0,315 и 0,16 мм.","x":"Електер: 5; 2,5; 1,25; 0,63; 0,315 және 0,16 мм."},{"i":"tdmhpe","q":"Електегі толық қалдық дегеніміз не?","r":"Что такое полный остаток на сите?","o":[["осы електегі және одан ірі барлық електердегі жеке қалдықтардың қосындысы","сумма частных остатков на данном сите и на всех более крупных"],["сынама массасының тек осы електе ғана қалған үлесі, пайызбен","доля массы пробы, оставшаяся только на этом сите, в процентах"],["осы електен және одан ұсақ барлық електерден өткен материалдың массасы","масса материала, прошедшего через это и все более мелкие сита"],["барлық стандартты електердегі жеке қалдықтардың орташа мәні","среднее частных остатков на всех стандартных ситах"],["ең ұсақ електегі қалдық","остаток на самом мелком сите"]],"e":"Частный остаток — доля пробы на одном сите; полный — сумма частных на данном и более крупных ситах.","x":"Жеке қалдық — сынаманың бір електегі үлесі; толық қалдық — осы және одан ірі електердегі жеке қалдықтардың қосындысы."},{"i":"1d00rob","q":"Құмның ірілік модулі қалай есептеледі?","r":"Как считают модуль крупности песка?","o":[["2,5-тен 0,16 мм-ге дейінгі електердегі толық қалдықтардың қосындысын 100-ге бөлу арқылы","делением суммы полных остатков на ситах от 2,5 до 0,16 мм на 100"],["2,5-тен 0,16 мм-ге дейінгі стандартты електердегі жеке қалдықтардың қосындысын 100-ге бөлу арқылы","делением на 100 суммы частных остатков на стандартных ситах от 2,5 до 0,16 мм"],["ең ірі түйір өлшемін ең ұсағына бөлу арқылы","делением наибольшего размера зерна на наименьший"],["үйінді т н кремнийфториді","водорастворимые: фторид и кремнефторид натрия"],["мыс купоросы","медный купорос"],["суда еритін: бура мен бор қышқылының қоспасы","водорастворимые: смесь буры и борной кислоты"],["мырыш хлориді","хлорид цинка"]],"e":"Маслянистые не вымываются, но пахнут и пачкают. Водорастворимые — для древесины, защищённой от вымывания.","x":"Майлы антисептиктер шайылмайды, бірақ иісі бар және былғайды. Суда еритіндері — шайылудан қорғалған ағашқа арналған."},{"i":"1v6wvry","q":"Ағашқа антисептикті ең терең сіңіретін тәсіл","r":"Способ самой глубокой пропитки древесины антисептиком","o":[["автоклавта қысыммен сіңіру","пропитка под давлением в автоклаве"],["қылқаламмен екі қабат жағу","нанесение кистью в два слоя"],["бүріккішпен бүрку","опрыскивание из распылителя"],["суық ваннада малып қою","вымачивание в холодной ванне"],["күнге кептіру","сушка на солнце"]],"e":"Под давлением в автоклаве; проще — нанесение на поверхность и горяче-холодные ванны.","x":"Автоклавта қысыммен сіңіру; қарапайым тәсілдері — бетіне жағу және ыстық-суық ванналар."},{"i":"hp9qfl","q":"Ағашты оттан қорғайтын заттар (аммоний тұздары, бура, бор қышқылы)","r":"Вещества, защищающие древесину от огня (соли аммония, бура, борная кислота)","o":[["антипирендер","антипирены"],["антисептиктер","антисептики"],["инсектицидтер","инсектициды"],["пигменттер","пигменты"],["балқытқыштар","плавни"]],"e":"При нагреве антипирены плавятся и закрывают поверхность плёнкой или выделяют негорючие газы; древесина становится трудносгораемой.","x":"Қыздырғанда антипирендер балқып, бетті қабыршақпен жабады немесе жанбайтын газдар бөледі; ағаш қиын жанатын материалға айналады."},{"i":"1mg3ne1","q":"Камералық кептіруде ағаш қандай ылғалдылыққа дейін кептіріледі?","r":"До какой влажности сушат древесину при камерной сушке?","o":[["8–12 %",""],["15–20 %",""],["30 %",""],["35–40 %",""],["0 %",""]],"e":"Камерная — до 8–12 % за несколько суток; естественная (на воздухе под навесами) — до 15–20 % за недели и месяцы.","x":"Кам е Шателье аспабымен","прибором Ле Шателье"]],"e":"Дуктилометр: длина нити (в сантиметрах), в которую вытягивается образец до разрыва при 25 °C.","x":"Дуктилометр: 25 °C-та үлгі үзілгенге дейін созылатын жіптің ұзындығы (сантиметрмен)."},{"i":"v811dv","q":"«Сақина мен шар» әдісімен битумның қай көрсеткіші анықталады?","r":"Какой показатель битума определяют методом «кольцо и шар»?","o":[["жұмсару температурасы","температура размягчения"],["морттық температурасы","температура хрупкости"],["тұтану температурасы","температура вспышки"],["созылғыштығы","растяжимость"],["тұтқырлығы","вязкость"]],"e":"Температура, при которой битум в кольце под стальным шариком продавливается до нижней пластинки.","x":"Сақинадағы битум болат шариктің астында төменгі пластинаға дейін басылып түсетін температура."},{"i":"1c2ommq","q":"Қатты битумға қандай көрсеткіштер тән?","r":"Какие показатели характерны для твёрдого битума?","o":[["пенетрациясы аз, созылғыштығы аз, жұмсару температурасы жоғары","малая пенетрация, малая растяжимость, высокая температура размягчения"],["пенетрациясы көп, созылғыштығы көп, жұмсару температурасы төмен","большая пенетрация, большая растяжимость, низкая температура размягчения"],["пенетрациясы көп, жұмсару температурасы жоғары","большая пенетрация, высокая температура размягчения"],["барлық көрсеткіштері жоғары","все показатели высокие"],["барлық көрсеткіштері нөлге тең","все показатели равны нулю"]],"e":"Показатели связаны между собой; по ним назначают марку.","x":"Көрсеткіштер өзара байланысты; марка солар бойынша тағайындалады."},{"i":"1ekykb5","q":"БН 90/10 маркасындағы сандар нені білдіреді?","r":"Что означают числа в марке БН 90/10?","o":[["алымы — жұмсару температурасы (°C), бөлімі — пенетрация","числитель — температура размягчения (°C), знаменатель — пенетрация"],["алымы — пенетрация, бөлімі — созылғыштық","числитель — пенетрация, знаменатель — растяжимость"],["алымы — тығыздық, бөлімі — ылғалдылық","числитель — плотность, знаменатель — влажность"],["битум мен толтырғыштың қатынасы","соотношение битума и наполнителя"],["алымы — беріктік, бөлімі — аязға төзімділік","числитель — прочность, знаменатель — морозостойкость"]],"e":"Строительные БН и кровельные БНК — так; у дорожных БНД (например, 60/90) оба числа — пределы пенетрации при 25 °C.","x":"Құрылыстық БН және жабындық БНК битумдарында — осылай; жол битумдарында БНД (мысалы, 60/90) екі сан да — 25 °C-тағы пенетрацияның шектері."},{"i":"zkyrqh","q":"Қара май (дёготь) қалай алынады?","r":"Как получают дёготь?","o":[["қатты отынды (тас көмір, тақта тас, ағаш, шымтезек) ауа жібермей қыздырып — құрғақ айдаумен","сухой перегонкой (нагревом без доступа воздуха) твёрдого топлива"],["мұнайды айдағаннан қалған ауыр қалдықтан (гудроннан) немесе оны ыстық күйінде ауамен үрлеп тотықтырып","из тяжёлого остатка перегонки нефти (гудрона) или его окислением продувкой воздухом в горячем виде"],["битумды жыныстардан ыстық сумен немесе органикалық еріткішпен бөліп алып","извлечением из битуминозных пород горячей водой или органическим растворителем"],["битумды эмульгатор қосылған ыстық суда ұсақ тамшыларға эмульсиялап","эмульгированием битума в мельчайшие капли в горячей воде с эмульгатором"],["әк пен кварц құмының қоспасын автоклавта қысымды бумен булап","запариванием смеси извести и кварцевого песка паром под давлением в автоклаве"]],"e":"В строительстве применяют каменноугольные дёгти — побочный продукт коксования; после отгонки воды и масел остаётся пек.","x":"Құрылыста тас көмір қара майлары қолданылады — кокстеудің қосалқы өнімі; су мен майларды айдап алғаннан кейін пек қалады."},{"i":"w7t8b9","q":"Қара майлар битумдармен салыстырғанда қандай?","r":"Каковы дёгти по сравнению с битумами?","o":[["материалдарға жақсырақ жабысады және шірімейді, бірақ тезірек ескіреді және канцерогенді","лучше прилипают и не гниют, но быстрее стареют и канцерогенны"],["баяуырақ ескіреді, иісі жоқ және адам денсаулығына мүлде зиянсыз","медленнее стареют, не пахнут и совершенно безвредны для здоровья"],["ауа райына әлдеқайда төзімдірек, сондықтан тұрғын үйлердің жабындарында кеңінен қолданылады","намного более атмосферостойки, поэтому широко применяются в кровлях жилых зданий"],["материалдарға нашар жабысады, тез шіриді, бірақ ешқашан ескірмейді","хуже прилипают к материалам, быстро гниют, но никогда не стареют"],["жанбайды, сондықтан өрт қаупі бар жерлерде қолданылады","не горят, поэтому применяются в пожароопасных местах"]],"e":"Дёгти — антисептики (ядовиты для грибов), но из-за запаха и канцерогенности в жилых зданиях их не применяют.","x":"Қара майлар — антисептиктер (саңырауқықтарға улы), бірақ иісі мен канцерогендігіне байланысты тұрғын үйлерде қолданылмайды."}]},{"id":"17-2","kz":"Асфальт-бетондар мен асфальт ерітінділері","ru":"Асфальтовые бетоны и растворы","q":[{"i":"cbrn3p","q":"Асфальт байланыстырғышы дегеніміз не?","r":"Что такое асфальтовое вяжущее?","o":[["битумның ұсақ ұнтақталған минералды ұнтақпен қоспасы","смесь битума с тонкомолотым минеральным порошком"],["битумның эмульгатор қосылған судағы эмульсиясы","эмульсия битума в воде с эмульгатором"],["цемент пен құмның қоспасы","смесь цемента с песком"],["қара май мен әктің қоспасы","смесь дёгтя с известью"],["битумның бензин немесе керосиндегі сұйық ерітіндісі (праймер)","жидкий раствор битума в бензине или керосине (праймер)"]],"e":"Порошок (известняк, доломит) переводит битум из объёмного в плёночное состояние: тонкие плёнки прочнее и теплостойче.","x":"Ұнтақ (әктас, доломит) битумды көлемдік күйден пленкалық күйге ауыстырады: жұқа пленкалар берігірек әрі жылуға төзімдірек."},{"i":"7uyzov","q":"Асфальт-бетонның құрамы қандай?","r":"Каков состав асфальтобетона?","o":[["жарықшақ тас (малта тас), құм, минералды ұнтақ және битум","щебень (гравий), песок, минеральный порошок и битум"],["цемент, құм, жарықшақ тас (малта тас) және су","цемент, песок, щебень (гравий) и вода"],["сөндірілген әк, кварц құмы, минералды ұнтақ және су","гашёная известь, кварцевый песок, минеральный порошок и вода"],["биту трузионного пенополистирола?","o":[["ұяшықтары жабық, суды сіңірмейді дерлік","закрытые ячейки, почти не впитывает воду"],["жанбайды, отқа төзімділігі жоғары","не горит, высокая огнестойкость"],["400 °C-қа дейінгі температурада жұмыс істейді","работает при температуре до 400 °C"],["талшықты құрылымды, бу өткізгіштігі жоғары","волокнистая структура, высокая паропроницаемость"],["тығыздығы 500 кг/м³","плотность 500 кг/м³"]],"e":"Пенополистирол: плотность 15–50 кг/м³, теплопроводность 0,03–0,04; работает до 70–80 °C, горюч.","x":"Пенополистирол: тығыздығы 15–50 кг/м³, жылу өткізгіштігі 0,03–0,04; 70–80 °C-қа дейін жұмыс істейді, жанғыш."},{"i":"ebmkt0","q":"Сыммен тігілген, престелген қамыс сабақтарынан жасалған плиталар","r":"Плиты из прессованных стеблей камыша, прошитые проволокой","o":[["камышит","камышит"],["фибролит","фибролит"],["арболит","арболит"],["совелит","совелит"],["вулканит","вулканит"]],"e":"Камышит: плотность 175–250 кг/м³, теплопроводность 0,05–0,08; для помещений с влажностью воздуха не выше 70 %.","x":"Камышит (қамыс плита): тығыздығы 175–250 кг/м³, жылу өткізгіштігі 0,05–0,08; ауа ылғалдылығы 70 %-тен аспайтын бөлмелерге арналған."},{"i":"82l02n","q":"Жоғары кеуектілік жасаудың тәсілі ЕМЕС нұсқа қайсы?","r":"Какой вариант НЕ является способом создания высокой пористости?","o":[["араласпаны дірілдетіп нығыздау","уплотнение смеси вибрированием"],["көбіктендіру және газ түзу","вспенивание и газообразование"],["жанып кететін қоспалар енгізу","введение выгорающих добавок"],["күйдіргенде көпірту","вспучивание при обжиге"],["талшықты қаңқа жасау","создание волокнистого каркаса"]],"e":"Вибрирование, наоборот, уплотняет. Пористость создают вспениванием, испарением большого количества воды, выгорающими добавками, вспучиванием, волокнистым каркасом.","x":"Дірілдету, керісінше, тығыздайды. Кеуектілік көбіктендіру, көп мөлшердегі суды буландыру, жанып кететін қоспалар, кеуіктіру, талшықты қаңқа арқылы жасалады."}]},{"id":"17-6","kz":"Акустикалық материалдар","ru":"Акустические материалы","q":[{"i":"fiosmr","q":"Акустикалық материалдар қолданылуы бойынша қалай бөлінеді?","r":"Как делят акустические материалы по назначению?","o":[["дыбыс жұтқыш және дыбыс оқшаулағыш","звукопоглощающие и звукоизоляционные"],["жанатын және жанбайтын","сгораемые и несгораемые"],["табиғи және жасанды","природные и искусственные"],["ыстық және суық","горячие и холодные"],["қатаятын (вулканданатын) және қатаймайтын","твердеющие (вулканизирующиеся) и нетвердеющие"]],"e":"Звукопоглощающие (дыбыс жұтқыш) уменьшают шум в самом помещении; звукоизоляционные (в учебнике «дыбыс өткізбейтін») не дают шуму пройти в соседнее.","x":"Дыбыс жұтқыш материалдар бөлменің өзіндегі шуды азайтады; дыбыс оқшаулағыштар (оқулықта «дыбыс өткізбейтін») шуды көрші бөлмеге өткізбейді."},{"i":"tbi79a","q":"Дыбыс жұту коэффициенті α нені көрсетеді?","r":"Что показывает коэффициент звукопоглощения α?","o":[["бет жұтқан дыбыс энергиясының үлесін","долю энергии звука, поглощённую поверхностью"],["материалдың тығыздығын","плотность материала"],["беттен шағылған дыбыс толқынының жиілігін","частоту звуковой волны, отражённой от поверхности"],["материалдың қалыңдығын","толщину материала"],["дыбыс жылдамдығын","скорость звука"]],"e":"У открытого окна α = 1; звукопоглощающими считают материалы с α больше 0,2.","x":"Ашық терезеде α = 1; α мәні 0,2-ден артық материалдар дыбыс жұтқыш деп саналады."},{"i":"fhhgfa","q":"Қандай материалдар дыбыс жұтқыш деп есептеледі?","r":"Какие материалы считают звукопоглощающими?","o":[["дыбыс жұту коэффициенті 0,2-ден артық","с коэффициентом звукопоглощения больше 0,2"],["дыбыс жұту коэффициенті 0,02-ден кем","с коэффициентом меньше 0,02"],["тығыздығы 2500 кг/м³-ден артық","с плотностью больше 2500 кг/м³"],["кеуектілігі нөлге тең","с нулевой пористостью"],["кеуектері тек тұйық","только с замкнутыми порами"]],"e":"Классы: первый — больше 0,8; второй — 0,4–0,8; третий — 0,2–0,4.","x":"Кластар: бірінші — 0,8-ден артық; екінші — 0,4–0,8; үшінші — 0,2–0,4." ина, вспененный полиэтилен, пробка; их динамический модуль упругости должен быть небольшим.","x":"Минералды мақтадан жасалған маттар мен плиталар, жұмсақ ДВП, кеуекті резеңке, көбіктелген полиэтилен, тығын; олардың динамикалық серпімділік модулі аз болуы керек."},{"i":"1xk5sfu","q":"Дыбыс жұтуды не күшейтеді?","r":"Что усиливает звукопоглощение?","o":[["бет жағын тесу (перфорация) және плита артындағы ауа саңылауы","перфорация лицевой поверхности и воздушный зазор за плитой"],["бетті тегістеп, жылтырату және лакпен қаптау","выравнивание, полировка и покрытие поверхности лаком"],["бетті қалың қабатпен майлы бояумен бояп, барлық ашық кеуектерді жабу","окраска толстым слоем масляной краски с закрытием всех открытых пор"],["материалды тығыздап, орташа тығыздығын арттыру","уплотнение материала, повышение средней плотности"],["материалды сулап, кеуектерін суға толтыру","увлажнение материала и заполнение пор водой"]],"e":"Перфорация и воздушный зазор. Плотная окраска, наоборот, закрывает поры.","x":"Перфорация және ауа саңылауы. Қалың бояу, керісінше, кеуектерді жауып тастайды."}]},{"id":"17-7","kz":"Әрлеулік материалдар: бояулар мен лактар","ru":"Отделочные материалы: краски и лаки","q":[{"i":"xs816u","q":"Лак-бояу материалының кепкеннен кейін пленка түзіп, пигмент бөлшектерін бекітетін компоненті","r":"Компонент лакокрасочного материала, который после высыхания образует плёнку и скрепляет частицы пигмента","o":[["байланыстырғыш (пленка түзгіш)","связующее (плёнкообразующее)"],["пигмент (түс беретін ұнтақ)","пигмент (окрашивающий порошок)"],["толтырғыш (арзандататын ұнтақ)","наполнитель (удешевляющий порошок)"],["еріткіш","растворитель"],["сиккатив (кебуді тездеткіш)","сиккатив (ускоритель высыхания)"]],"e":"Связующие: олифы, полимеры (алкидные, акриловые, эпоксидные), клеи, жидкое стекло, известь, цемент.","x":"Байланыстырғыштар: олифтер, полимерлер (алкидті, акрилді, эпоксидті), желімдер, сұйық шыны, әк, цемент."},{"i":"1iunilg","q":"Байланыстырғышта ерімейтін, түс пен ь — непрореагировавшие зёрна.","m":1,"k":3,"x":"Қатаңдық пен серпімділікті Ca(OH)₂ мен эттрингит кристалдары береді; микротолтырғыш — әрекеттеспеген түйірлер."},{"i":"1te4v5","q":"Цемент тасы неге микробетон деп аталады?","r":"Почему цементный камень называют микробетоном?","o":[["байланыстырушы массада берік түйірлер орналасқан","в связующей массе расположены прочные зёрна"],["онда ірі жарықшақ тас пен кварц құмының түйірлері бар","в нём есть зёрна крупного щебня и кварцевого песка"],["ол тек зертханада, микроскоппен ғана жасалады","его делают только в лаборатории под микроскопом"],["оның беріктігі өте аз","у него очень малая прочность"],["ол тек микрокремнезем мен судан тұрады","он состоит только из микрокремнезёма и воды"],["онда кеуек мүлде жоқ","в нём совсем нет пор"]],"e":"Непрореагировавшие ядра зёрен клинкера работают как микрозаполнитель в гелевой массе.","m":1,"k":1,"x":"Клинкер түйірлерінің әрекеттеспеген өзектері гель массасында микротолтырғыш қызметін атқарады."},{"i":"1jxy79h","q":"Цемент тасының кристалдық және гельдік бөліктерінің арақатынасы туралы дұрыс тұжырымдар","r":"Верные утверждения о соотношении кристаллической и гелевой частей цементного камня","o":[["кристалдар көп болса — қатаңдық жоғары","много кристаллов — высокая жёсткость"],["гель көп болса — деформацияланғыштық жоғары","много геля — высокая деформативность"],["арақатынас цементтің минералдық құрамына байланысты","соотношение зависит от минерального состава цемента"],["гель көп болса — қатаңдық жоғары","много геля — высокая жёсткость"],["арақатынас тастың қасиеттеріне әсер етпейді","соотношение не влияет на свойства камня"],["кристалдар шөгуге жауап береді","за усадку отвечают кристаллы"]],"e":"Гель отвечает за усадку и ползучесть.","m":1,"k":3,"x":"Гель шөгу мен жылжығыштыққа жауап береді."},{"i":"1fwcbj","q":"Кеуектердегі сұйықтың жоғары сілтілігі не береді?","r":"Что даёт высокая щёлочность жидкости в порах?","o":[["болатты пассивтендіреді: арматура тот баспайды","пассивирует сталь: арматура не ржавеет"],["цемент тасын біртіндеп ерітіп, беріктікті төмендетеді","постепенно растворяет цементный камень и снижает прочность"],["толтырғышты бояйды","окрашивает заполнитель"],["бетонды суға төзімсіз етеді","делает бетон неводостойким"],["арматура коррозиясын тездетіп, тоттың көлемін ұлғайтады","ускоряет коррозию арматуры и увеличивает объём ржавчины"],["беріктікті нөлге түсіреді","снижает прочность до нуля"]],"e":"Жидкость в порах — раствор щелочей, прежде всего Ca(OH)₂; пока щёлочность сохраняется, арматура не корродирует.","m":1,"k":1,"x":"Кеуектердегі сұйық — сілтілердің, ең алдымен Ca(OH)₂-нің ерітіндісі; сілтілік сақталып тұрғанда арматура тот баспайды."}]},{"id":"23-5","kz":"Цемент тасы мен бетонның кеуектері","ru":"Поры цементного камня и бетона","q":[{"i":"r46gtn","q":"Гель кеуектері туралы дұрыс тұжырымдар","r":"Верные утверждения о гелевых порах","o":[["өлшемі 0,1 мкм-ден кіші","размер меньше 0,1 мкм"],["гель бөлшектерінің арасындағы саңылаулар","промежутки между частицами геля"],["олардағы су тек −50 °C және одан төмен температурада қатады","вода в них замерзает только при −50 °C и ниже"],["өлшемі 0,1–20 мкм","размер 0,1–20 мкм"],["ең зиянды кеуектер","самые вредные поры"],["олардағы су −5 °C-та қатады","вода в них замерзает при −5 °C"]],"e":"Гелевые поры почти безвредны: вода в них удерживается поверхностью частиц и не течёт под действием силы тяжести.","m":1,"k":3,"x":"Гель кеуектерінің зияны жоқ дерлік: олардағы су бөлшектердің бетімен ұсталып тұрады, ауырлық күшімен ақпайды."},{"i":"1bi2sfy","q":"Капилляр кеуектер туралы дұрыс тұжырымдар","r":"Верные утверждения о капиллярных порах","o":[["өлшемі 0,1–20 мкм","размер 0,1–20 мкм"],["буланып кеткен артық араластыру суының орнында қалады","остаются на месте испарившейся избыточной воды затворения"],["ең зиянды кеуектер: беріктік, өткізгіштік, аязға төзімділік соларға байланысты","самые вредные: от них зависят прочность, проницаемость, морозостойкость"],["араластырғанда тартылған ауадан пайда болады","образуются из вовлечённого при перемешивании воздуха"],["әдетте тұйық, суға толмайды","обычно замкнутые, водой не заполняются"],["өлшемі 2 мм-ден ірі","размер больше 2 мм"]],"e":"В капиллярных порах вода движется и замерзает уже при −5 °C.","m":1,"k":3,"x":"Капилляр кеуектерде су қозғалады және −5 °C-тың өзінде қатады."},{"i":"1npykvp","q":"Ауа кеуектері туралы дұрыс тұжырымдар","r":"Верные утверждения о воздушных порах","o":[["өлшемі 50–100 мкм-ден 2 мм-ге дейін","размер от 50–100 мкм до 2 мм"],["әдетте тұйық, суға толмайды","обычно замкнутые, водой не заполняются"],["ұсақ, біркелкі таралғандары аязға төзімділікті арттырады","мелкие равномерно распределённые повышают морозостойкость"],["кез келген ауа беріктікті арттырады","любой воздух повышает прочность"],["гельдің ажырамас бөлігі","неотъемлемая часть геля"],["өлшемі 0,1 мкм-ден кіші","размер меньше 0,1 мкм"]],"e":"Это резервные поры; но любой воздух снижает прочность.","m":1,"k":3,"x":"Бұлар — резервтік кеуектер; бірақ кез келген ауа беріктікті төмендетеді."},{"i":"zld3dc","q":"Контракция дегеніміз не?","r":"Что такое контракция?","o":[["гидратация өнімдері көлемінің әрекеттескен цемент пен су көлемдерінің қосындысынан аз болуы","объём продуктов гидратации меньше суммы объёмов прореагировавших цемента и воды"],["ауада қатайғанда судың булануынан цемент тасы мен бетон көлемінің біртіндеп кішіреюі (шөгу)","постепенное уменьшение объёма цементного камня и бетона при твердении на воздухе из-за испарения воды (усадка)"],["кеуектердегі судың мұзға айналғанда көлемінің шамамен 9 %-ке ұлғаюы","увеличение объёма воды в порах примерно на 9 % при превращении в лёд"],["ауыр бөлшектер шөгіп, судың араласпа бетіне ығысып шығуы","оседание тяжёлых частиц и вытеснение воды на поверхность смеси"],["тұрақты ұзақ мерзімді күш әсерінен бетон деформациясының уақыт бойынша өсуі (жылжығыштық)","рост деформаций бетона во времени под постоянной длительной нагрузкой (ползучесть)"],["суда немесе ылғалды ортада қатайғанда көлемнің сәл ұлғаюы","небольшое увеличение объёма при твердении в воде или влажной среде"]],"e":"Контракция (стяжение) тем сильнее, чем тоньше помол цемента; контракционные поры очень мелкие.","m":1,"k":1,"x":"Цемент неғұрлым ұсақ ұнтақталса, контракция (тартылу) соғұрлым күшті; контракциялық кеуектер өте ұсақ."},{"i":"10rgdux","q":"Седиментациялық қуыстар қайдан пайда болады?","r":"Откуда берутся седиментационные полости?","o":[["ішкі су бөлінуден кейін ірі толтырғыш түйірлерінің астында қалады","остаются под зёрнами крупного заполнителя после внутреннего водоотделения"],["арматура шыбықтарының астында қалады","остаются под стержнями арматуры"],["гель бөлшектерінің арасында түзіледі","образуются между частицами геля"],["ауа тартқыш қоспадан пайда болады","образуются от воздухововлекающей добавки"],["контракция нәтижесінде түзіледі","образуются в результате контракции"],["карбонизациядан пайда болады","образуются от карбонизации"]],"e":"Вода скапливается под зёрнами и арматурой, а после её испарения остаются полости.","m":1,"k":2,"x":"Су түйірлер мен арматураның астына жиналады, ал ол буланған соң қуыстар қалады."},{"i":"t9x0sy","q":"Цементке қанша су керек?","r":"Сколько воды нужно цементу?","o":[["толық гидратацияға цемент массасының 24–26 %-і жеткілікті","для полной гидратации достаточно 24–26 % от массы цемента"],["иленгіш қамыр алу үшін 40–60 % керек","для пластичного теста нужно 40–60 %"],["бетон араласпасында С/Ц әдетте 0,4–0,7","в бетонной смеси В/Ц обычно 0,4–0,7"],["толық гидратацияға 100 % су керек","для полной гидратации нужно 100 % воды"],["бетон араласпасында С/Ц әдетте 2–3","в бетонной смеси В/Ц обычно 2–3"],["иленгіш қамырға 5 % су жеткілікті","для пластичного теста достаточно 5 %"]],"e":"Вся вода сверх химически и адсорбционно связанной остаётся свободной и после испарения превращается в капиллярные поры.","m":1,"k":3,"x":"Химиялық және адсорбциялық байланысқан судан артық судың бәрі бос күйінде қалып, буланғаннан кейін капилляр кеуектерге айналады."},{"i олат бетіндегі қорғаныш қабыршақ қышқыл ортада түзіледі","защитная плёнка на стали образуется в кислой среде"],["арматура бетон ішінде хлоридтер қабатымен қапталады","арматура в бетоне покрывается слоем хлоридов"]],"e":"В такой среде арматура не ржавеет десятилетиями.","m":1,"k":2,"x":"Мұндай ортада арматура ондаған жылдар бойы тот баспайды."},{"i":"10bhivh","q":"Арматураның қорғанысы қандай жағдайларда жойылады?","r":"В каких случаях арматура теряет защиту?","o":[["қорғаныс қабаты карбонизацияланғанда","при карбонизации защитного слоя"],["хлоридтер әсер еткенде","при действии хлоридов"],["бетон ылғалды күтімде болғанда","при влажном уходе за бетоном"],["С/Ц төмен болғанда","при низком В/Ц"],["қорғаныс қабаты қалың болғанда","при толстом защитном слое"],["коррозия ингибиторы қосылғанда","при введении ингибитора коррозии"]],"e":"Два пути депассивации стали: карбонизация и хлориды.","m":1,"k":2,"x":"Болаттың қорғанысын жоятын екі жол: карбонизация және хлоридтер."},{"i":"1fj6t6s","q":"Қорғаныс қабатының карбонизациясы туралы дұрыс тұжырымдар","r":"Верные утверждения о карбонизации защитного слоя","o":[["ауадағы көмірқышқыл газы кеуектерге еніп, әкті бейтараптайды","углекислый газ воздуха проникает в поры и нейтрализует известь"],["Ca(OH)₂ + CO₂ → CaCO₃ + H₂O",""],["карбонизация шебі арматураға жеткенде болат тоттана бастайды","когда фронт карбонизации доходит до арматуры, сталь начинает ржаветь"],["карбонизация кезінде сілтілік артады","при карбонизации щёлочность растёт"],["көмірқышқыл газы арматураны қорғайды","углекислый газ защищает арматуру"],["карбонизация тек су астында жүреді","карбонизация идёт только под водой"]],"e":"При карбонизации щёлочность снижается.","m":1,"k":3,"x":"Карбонизация кезінде сілтілік төмендейді."},{"i":"1txumkn","q":"Карбонизация жылдамдығы неге байланысты?","r":"От чего зависит скорость карбонизации?","o":[["бетонның өткізгіштігіне","от проницаемости бетона"],["ауа ылғалдылығына","от влажности воздуха"],["арматураның класына","от класса
