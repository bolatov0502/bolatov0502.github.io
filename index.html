n office work",""],["should be forbidden in large companies",""],["is suitable only for people without children",""]],"e":"Последнее предложение: «With good habits, remote work can be both productive and pleasant.»","p":1}]},{"id":"36-3","kz":"Text 3. The Aral Sea","ru":"Текст 3. Аральское море","q":[{"i":"pxtyax","q":"The text is mainly about","r":"","o":[["how the Aral Sea was damaged and partly saved",""],["how cotton is grown and irrigated in Central Asia",""],["the fishing industry of Uzbekistan",""],["the construction of dams in Kazakhstan",""]],"e":"Текст описывает высыхание моря и частичное восстановление его северной части.","p":2},{"i":"51lx5d","q":"In the past the Aral Sea was","r":"","o":[["one of the largest lakes in the world",""],["the largest river in Central Asia",""],["a small salt lake in the desert",""],["a dry plain with cotton fields",""]],"e":"«…was once the fourth largest lake in the world.»","p":2},{"i":"gdirmp","q":"Why did the sea begin to shrink?","r":"","o":[["River water was used for cotton fields",""],["There was no rain in the region for forty years",""],["The Kokaral Dam stopped both rivers",""],["Fishermen took too much water",""]],"e":"Воду Амударьи и Сырдарьи забирали на орошение хлопка: «was taken to irrigate cotton fields».","p":2},{"i":"1g45sgx","q":"The word «shrink» in the text is closest in meaning to","r":"","o":[["become smaller",""],["become deeper",""],["become warmer",""],["become cleaner",""]],"e":"Shrink — «уменьшаться, сокращаться»: воды поступало всё меньше.","p":2},{"i":"b64rvt","q":"What do strong winds carry from the dry sea bed?","r":"","o":[["salt and dust",""],["fish and water",""],["cotton and sand",""],["ships and boats",""]],"e":"«Strong winds carry salt and dust from the dry sea bed for hundreds of kilometres.»","p":2},{"i":"1idubfp","q":"What happened after the Kokaral Dam was built?","r":"","o":[["The water level in the northern part rose",""],["The whole sea returned to its old size",""],["The rivers changed their direction",""],["Cotton production in the region stopped",""]],"e":"«Since then, the water level there has risen, and fish have returned» — речь только о северной части.","p":2},{"i":"md2fju","q":"Which statement is TRUE according to the text?","r":"","o":[["Fishermen work again in some villages",""],["The Aral Sea lies between Kazakhstan and Russia",""],["The dam was completed in the 1960s",""],["The fish never returned to the sea",""]],"e":"«Fishermen are working again in several villages.» Плотина построена в 2005 году; море лежит между Казахстаном и Узбекистаном.","p":2},{"i":"nksghg","q":"What lesson does the writer draw from the story?","r":"","o":[["Nature is easy to damage but hard to repair",""],["People are not able to change nature at all",""],["Dams are always dangerous for rivers and seas",""],["Cotton should not be grown anywhere",""]],"e":"Последнее предложение: «how quickly people can damage nature — and how hard it is to repair it».","p":2}]},{"id":"36-4","kz":"Text 4. Sleep","ru":"Текст 4. Сон","q":[{"i":"yxsol2","q":"The text is mainly about","r":"","o":[["why sleep is important and how to improve it",""],["how students should prepare for exams",""],["why coffee is bad for our health",""],["how the brain works during the day",""]],"e":"Сначала объясняется, зачем нужен сон, затем даются советы, как спать лучше.","p":3},{"i":"i5tyoq","q":"What does the brain do at night?","r":"","o":[["It organises and saves information",""],["It stops working until the morning",""],["It repairs the muscles and the skin",""],["It forgets everything from the day",""]],"e":"«It sorts the information … and stores the most important things in our memory.»","p":3},{"i":"1gmv1rz","q":"According to the text, students get better results if they","r":"","o":[["sleep well before the exam",""],["study all night before the exam",""],["drink coffee before the exam",""],["get up very early in the morning",""]],"e":"«Students who sleep well before an exam usually get better results than those who study all night.»","p":3},{"i":"1mgrv4s","q":"How much sleep do adults need?","r":"","o":[["from seven to nine hours",""],["less than six hours a night",""],["exactly ten hours every night",""],["more than teenagers need",""]],"e":"«Adults need between seven and nine hours»; подросткам нужно ещё больше.","p":3},{"i":"kbqlz1","q":"The phrase «a lack of sleep» means","r":"","o":[["not enough sleep",""],["too much sleep",""],["very deep sleep",""],["a short rest in the afternoon",""]],"e":"A lack of — «нехватка, недостаток».","p":3},{"i":"l1i4y5","q":"Why should you switch off your phone before going to bed?","r":"","o":[["Screen light keeps the brain awake",""],["Phones are dangerous for growing muscles",""],["Late phone calls can cause road accidents",""],["The phone makes the bedroom warm",""]],"e":"«The light from screens tells the brain that it is still daytime» — мозг «думает», что ещё день.","p":3},{"i":"1kcohjk","q":"Which advice is NOT given in the text?","r":"","o":[["Take a hot bath before bedtime",""],["Go to bed at the same time every day",""],["Avoid coffee in the evening",""],["Keep your bedroom dark and quiet",""]],"e":"О горячей ванне в тексте не говорится; остальные три совета есть в последнем абзаце.","p":3},{"i":"1ug6u2d","q":"Which statement is TRUE according to the text?","r":"","o":[["Sleepy drivers are a danger on the roads",""],["Teenagers need less sleep than adults",""],["Most people sleep more than nine hours",""],["Sleep is less important than food",""]],"e":"«Sleepy drivers cause thousands of road accidents every year.»","p":3}]},{"id":"36-5","kz":"Text 5. The first skyscrapers","ru":"Текст 5. Первые небоскрёбы","q":[{"i":"1xabgs7","q":"The text is mainly about","r":"","o":[["how tall buildings became possible",""],["the life and inventions of Elisha Otis",""],["why land is so expensive in Chicago",""],["how engineers build long steel bridges",""]],"e":"Текст о двух изобретениях, сделавших возможными высотные здания, и о развитии небоскрёбов.","p":4},{"i":"124rcvk","q":"Why did architects begin to build upwards?","r":"","o":[["Land in city centres cost a lot",""],["People wanted better views",""],["Steel was cheaper than stone",""],["Lifts had become very popular",""]],"e":"«Land in the city centre was expensive, so architects began to build upwards.»","p":4},{"i":"ap75py","q":"What was special about Otis's lift?","r":"","o":[["It did not fall when the cable broke",""],["It was the fastest lift in the world",""],["It could carry a heavy steel frame",""],["It worked without a cable or electricity",""]],"e":"«…a lift that did not fall even if its cable broke» — безопасный лифт.","p":4},{"i":"1xmo5y5","q":"In older buildings the weight was carried by","r":"","o":[["thick walls",""],["a steel frame",""],["safety lifts",""],["a heavy roof",""]],"e":"«In older buildings, thick walls carried the whole weight.»","p":4},{"i":"19ietlm","q":"The word «enormous» in the text is closest in meaning to","r":"","o":[["very big",""],["very thin",""],["very old",""],["very light",""]],"e":"Enormous — «огромный»: стены первого этажа должны были быть очень толстыми.","p":4},{"i":"lnzxj0","q":"The Home Insurance Building","r":"","o":[["had ten floors and a steel frame",""],["was built in the centre of New York",""],["fell down soon after it was completed",""],["was more than 800 metres high",""]],"e":"«It had only ten floors, but it used a steel frame»; здание стояло в Чикаго больше сорока лет.","p":4},{"i":"ou4umg","q":"Which statement is TRUE according to the text?","r":"","o":[["The Burj Khalifa has more than 160 floors",""],["The first skyscraper is still standing in Chicago",""],["People were never afraid of tall buildings",""],["Elisha Otis invented the steel frame",""]],"e":"«It is 828 metres high and has more than 160 floors.»","p":4},{"i":"yir4c","q":"What can we understand from the last paragraph?","r":"","o":[["Buildings will probably become even taller",""],["Nobody wants to build tall towers any more",""],["The Burj Khalifa is one kilometre high",""],["Engineers have stopped planning new towers",""]],"e":"«Engineers are already planning towers that will be a kilometre high» — здания будут ещё выше.","p":4}]},{"id":"36-6","kz":"Text 6. Learning languages","ru":"Текст 6. Изучение языков","q":[{"i":"18y3png","q":"The text is mainly about","r":"","o":[["the benefits of learning languages and how to learn them",""],["how many languages there are in the world",""],["why children learn better than adults",""],["how to travel cheaply to other countries",""]],"e":"В тексте — польза изучения языков и советы, как учить.","p":5},{"i":"5l94t6","q":"According to the text, more than half of the people in the world","r":"","o":[["speak two or more languages",""],["speak seven thousand languages",""],["cannot learn a foreign language",""],["learn languages only for travelling",""]],"e":"«More than half of the world's population speaks at least two of them.» At least two — «как минимум два».","p":5},{"i":"8e5q19","q":"People who speak two languages are often good at","r":"","o":[["solving problems",""],["pronouncing difficult sounds",""],["remembering songs",""],["watching films",""]],"e":"«…are often better at solving problems and doing several things at the same time.»","p":5},{"i":"7q7een","q":"What do adults do better than children?","r":"","o":[["understand grammar rules",""],["learn correct pronunciation",""],["learn without any practice",""],["speak without an accent",""]],"e":"«Adults are better at understanding grammar rules»; произношение легче даётся детям.","p":5},{"i":"c18qcj","q":"The word «bilingual» describes a person who","r":"","o":[["speaks two languages",""],["is only learning to read",""],["teaches foreign languages",""],["has lived in two countries",""]],"e":"Bi- — «два», lingual — «языковой»: bilingual — говорящий на двух языках.","p":5},{"i":"1g1ayq4","q":"Which is better, according to the experts?","r":"","o":[["twenty minutes of study every day",""],["three hours of study once a week",""],["studying only when you have talent",""],["studying without making mistakes",""]],"e":"«It is better to study for twenty minutes every day than for three hours once a week.»","p":5},{"i":"1tlksga","q":"What does the writer say about mistakes?","r":"","o":[["They are a normal part of learning",""],["Good students almost never make them",""],["Adults make more mistakes than children",""],["They show that a person has no talent",""]],"e":"«Everybody makes them, and they are a natural part of learning.»","p":5},{"i":"8gu84y","q":"Which statement is NOT true according to the text?","r":"","o":[["Adults are too old to learn a new language",""],["Regular practice is more important than talent",""],["Learning a language trains the brain",""],["Using the language for enjoyable things helps",""]],"e":"«Many adults believe that they are too old… This is not true.»","p":5}]},{"id":"36-7","kz":"Text 7. Plastic in the ocean","ru":"Текст 7. Пластик в океане","q":[{"i":"1lkm63h","q":"The text is mainly about","r":"","o":[["plastic pollution and ways to reduce it",""],["how plastic is produced in modern factories",""],["why paper bags are better than textile bags",""],["the life of sea animals and birds",""]],"e":"Текст о загрязнении пластиком и о том, что можно сделать.","p":6},{"i":"16khxm8","q":"Why is plastic used everywhere?","r":"","o":[["It is cheap, light and strong",""],["It disappears fast in nature",""],["It is made from sea water",""],["It is good for our health",""]],"e":"Первое предложение: «Plastic is cheap, light and strong, so we use it everywhere.»","p":6},{"i":"1je3oz4","q":"How long may a plastic bottle take to break down?","r":"","o":[["about 450 years",""],["about 45 years",""],["about 4 years",""],["about 4,500 years",""]],"e":"«A plastic bottle may need about 450 years to break down.»","p":6},{"i":"1gnzp64","q":"Why do sea animals eat plastic?","r":"","o":[["They think it is food",""],["They like its taste",""],["It helps them to swim",""],["There is no other food in the sea",""]],"e":"«…because they look like food» — кусочки пластика похожи на пищу.","p":6},{"i":"s95wgf","q":"Microplastics are","r":"","o":[["very small pieces of plastic",""],["new materials that break down quickly",""],["small animals living in sea water",""],["thin plastic bags from shops",""]],"e":"«The sun and waves break plastic into very small pieces called microplastics.»","p":6},{"i":"kw0s5m","q":"The word «banned» in the text is closest in meaning to","r":"","o":[["forbidden",""],["produced",""],["advertised",""],["recycled",""]],"e":"Ban — «запрещать»: banned = forbidden.","p":6},{"i":"1isqcjv","q":"What does the writer call the simplest solution?","r":"","o":[["using less plastic",""],["developing new materials",""],["cleaning all the seas",""],["closing plastic factories",""]],"e":"«The simplest solution is in our own hands: we can use less plastic.»","p":6},{"i":"ojy10e","q":"Which statement is TRUE according to the text?","r":"","o":[["The danger of microplastics for people is still unclear",""],["Microplastics have been found only in fish",""],["All countries have already banned plastic bottles",""],["A plastic bottle breaks down in nature in a few months",""]],"e":"«Nobody knows yet how dangerous they are for people's health.»","p":6}]},{"id":"36-8","kz":"Text 8. Abai","ru":"Текст 8. Абай","q":[{"i":"1i2vm4a","q":"The text is mainly about","r":"","o":[["the life and work of a great Kazakh poet",""],["the history of schools in the city of Semey",""],["Russian poets of the nineteenth century",""],["the education system of modern Kazakhstan",""]],"e":"Текст о жизни и творчестве Абая.","p":7},{"i":"15783is","q":"Where was Abai born?","r":"","o":[["in the Chingistau mountains",""],["in the city of Semey",""],["in the south of Kazakhstan",""],["in a village near the Russian border",""]],"e":"«He was born in 1845 in the Chingistau mountains in the east of Kazakhstan.» В Семее он учился.","p":7},{"i":"6gdkl4","q":"What did Abai's father want?","r":"","o":[["He wanted his son to lead the people",""],["He wanted his son to become a famous poet",""],["He wanted his son to move to Russia",""],["He wanted his son to be a teacher",""]],"e":"«…wanted his son to become a leader of the people.»","p":7},{"i":"1x7benn","q":"How did Abai learn about the literature of the East and the West?","r":"","o":[["through books",""],["through travelling",""],["through his father",""],["through songs",""]],"e":"«Thanks to books, he discovered the literature of both the East and the West.»","p":7},{"i":"1bhf8i3","q":"Besides writing poems, Abai","r":"","o":[["composed songs and translated poetry",""],["built schools and monuments in Semey",""],["painted pictures of the mountains",""],["worked as a doctor in his village",""]],"e":"«He also composed songs… he translated the works of Russian poets.»","p":7},{"i":"83n2xa","q":"The «Book of Words» consists of","r":"","o":[["forty-five short texts",""],["poems about nature and love",""],["translations of Pushkin",""],["songs for young people",""]],"e":"«It consists of forty-five short texts» — это прозаическое произведение.","p":7},{"i":"12zauog","q":"The word «encouraged» in the text is closest in meaning to","r":"","o":[["inspired",""],["forbade",""],["punished",""],["forgot",""]],"e":"Encourage — «поощрять, побуждать»: он призывал молодёжь учиться.","p":7},{"i":"v3oxeq","q":"What did Abai believe?","r":"","o":[["Knowledge and science lead to a better future",""],["Young people should not read foreign books",""],["Only rich and powerful people need education",""],["Poetry is much more important than science",""]],"e":"«He believed that knowledge and science were the only way to a better future.»","p":7}]},{"id":"36-9","kz":"Text 9. Smart homes","ru":"Текст 9. Умный дом","q":[{"i":"ysp5bf","q":"The text is mainly about","r":"","o":[["smart homes and their good and bad sides",""],["how to make good coffee at home in the morning",""],["why hackers are dangerous for large companies",""],["how to save money on mobile phones",""]],"e":"Текст объясняет, что такое умный дом, его плюсы и минусы.","p":8},{"i":"1r2bt8g","q":"How can the owner control the devices in a smart home?","r":"","o":[["by phone or by voice",""],["only by hand, with switches",""],["by sending letters",""],["with special keys",""]],"e":"«The owner can control them with a phone or with voice commands.»","p":8},{"i":"q4t0kf","q":"What can sensors do?","r":"","o":[["notice smoke or a water leak",""],["cook dinner for the family",""],["repair the heating system",""],["pay the electricity bills",""]],"e":"«Sensors can notice smoke or a water leak and send a message to your phone.»","p":8},{"i":"1b7yno4","q":"How do smart homes save energy?","r":"","o":[["They turn off lights in empty rooms",""],["They use only solar and wind energy",""],["They work only at night, when it is cool",""],["They switch off the internet",""]],"e":"«The system turns off lights in empty rooms and lowers the temperature at night.»","p":8},{"i":"yql7ky","q":"The word «disadvantages» in the text is closest in meaning to","r":"","o":[["negative sides",""],["useful functions",""],["new devices",""],["electricity bills",""]],"e":"Disadvantage — «недостаток»; приставка dis- даёт противоположное значение к advantage.","p":8},{"i":"kqck2v","q":"Why can hackers be dangerous for a smart home?","r":"","o":[["They can open doors or watch people",""],["They can make the house cold in winter",""],["They can break the furniture",""],["They can increase electricity bills",""]],"e":"«…they can open the doors or watch people through cameras.»","p":8},{"i":"t2urnx","q":"What do experts advise?","r":"","o":[["to use strong passwords and update devices",""],["not to buy smart devices for the bedroom",""],["to switch off the internet every night",""],["to hide all cameras from the guests",""]],"e":"«Experts advise owners to use strong passwords and to update their devices regularly.»","p":8},{"i":"1yyg13v","q":"What does the writer think about the future of smart homes?","r":"","o":[["They will probably become very common",""],["They will disappear in a few years",""],["They will be forbidden because of hackers",""],["They will be used only in offices",""]],"e":"«They will probably become as common as mobile phones are today.»","p":8}]},{"id":"36-10","kz":"Text 10. The Great Wall","ru":"Текст 10. Великая Китайская стена","q":[{"i":"k5ko9z","q":"The text is mainly about","r":"","o":[["the history and construction of the Great Wall",""],["the rulers of the Ming dynasty",""],["how sticky rice is grown and cooked in China",""],["the development of tourism in modern China",""]],"e":"Текст об истории, материалах и особенностях Великой стены.","p":9},{"i":"qwq6rw","q":"The Great Wall is","r":"","o":[["a system of walls and towers",""],["one single wall without towers",""],["a modern copy of an old wall",""],["a natural chain of mountains",""]],"e":"«It is not a single wall but a system of walls and towers.»","p":9},{"i":"iob2ze","q":"Why were the first walls built?","r":"","o":[["to protect the country from enemies",""],["to attract tourists from abroad",""],["to grow rice on the plains",""],["to connect cities in the mountains",""]],"e":"«…to protect the country from enemies who attacked from the north.»","p":9},{"i":"8a23m1","q":"When was most of today's wall built?","r":"","o":[["during the Ming dynasty",""],["more than two thousand years ago",""],["in the twentieth century",""],["in 1987",""]],"e":"«Most of the wall that tourists visit today was built … during the Ming dynasty.»","p":9},{"i":"7aa97v","q":"Why did the builders use different materials?","r":"","o":[["They used what they found in each place",""],["Stone was too expensive for the rulers",""],["Bricks had not been invented at that time",""],["The rulers ordered them to use only earth",""]],"e":"«The builders used the materials they could find nearby» — в горах камень, на равнинах землю и кирпич.","p":9},{"i":"1u10qmq","q":"What did sticky rice do to the mortar?","r":"","o":[["It made it stronger and more water-resistant",""],["It made it cheaper and easier to prepare",""],["It made it white and pleasant to look at",""],["It made it softer and much lighter than before",""]],"e":"«This made the mortar stronger and more resistant to water.» Mortar — строительный раствор.","p":9},{"i":"v0pyq6","q":"The word «myth» in the text is closest in meaning to","r":"","o":[["a popular but false belief",""],["a well-known scientific fact",""],["an ancient building",""],["a long journey",""]],"e":"Myth — «миф, распространённое заблуждение»: на самом деле стену из космоса разглядеть трудно.","p":9},{"i":"idws6w","q":"Which statement is TRUE according to the text?","r":"","o":[["The Great Wall became a UNESCO site in 1987",""],["Astronauts can easily see the wall from space",""],["The wall is about two thousand kilometres long",""],["The wall was built in a few years",""]],"e":"«Since 1987 the Great Wall has been on the UNESCO World Heritage list.»","p":9}]}],"terms":[],"rd":1}]}],"passages":["Concrete: the material that built the modern world\nConcrete is the most widely used building material in the world. People use more concrete than any other material except water.\nConcrete is made from four main ingredients: cement, water, sand and crushed stone or gravel. When cement is mixed with water, a chemical reaction starts, and the mixture slowly becomes hard like stone. This process is called hardening, and it continues for many weeks.\nThe ancient Romans already used a kind of concrete two thousand years ago. Some of their buildings, such as the Pantheon in Rome, are still standing today. Modern cement appeared in England: in 1824 a builder named Joseph Aspdin patented it. He called it Portland cement because its colour was similar to the stone from the Isle of Portland.\nConcrete is strong when it is pressed, but it is weak when it is pulled or bent. That is why engineers put steel bars inside it. This combination is called reinforced concrete, and it is used for bridges, tall buildings and dams.\nHowever, producing cement requires a lot of energy and releases carbon dioxide into the air. Today scientists are looking for greener ways to make concrete, for example by replacing part of the cement with industrial waste such as ash and slag.","Working from home\nA few years ago, most office workers travelled to work every day. Today many people work from home, at least part of the week. This way of working is called remote work.\nRemote work has many advantages. Employees do not waste time in traffic, so they have more time for their families and hobbies. They can also save money on transport and lunches. Companies benefit too: they need less office space and can hire talented people from other cities and even other countries.\nHowever, working from home is not always easy. Some people feel lonely because they do not see their colleagues. Others find it difficult to concentrate when children or pets are around. It can also be hard to stop working in the evening, because the office is always only a few steps away.\nExperts give some simple advice. First, have a separate place for work, even if it is just a small desk. Second, keep regular working hours. Finally, stay in touch with your team through video calls and messages. With good habits, remote work can be both productive and pleasant.","The Aral Sea\nThe Aral Sea, which lies between Kazakhstan and Uzbekistan, was once the fourth largest lake in the world. Fishing boats sailed on it, and thousands of people worked in the fishing industry.\nIn the 1960s, the situation began to change. Water from the two rivers that fed the sea, the Amu Darya and the Syr Darya, was taken to irrigate cotton fields. As a result, less and less water reached the sea, and it started to shrink. By the beginning of the twenty-first century it had lost most of its water. The fish died, the ports were left far from the shore, and old ships now lie in the sand.\nThe disaster also affected people's health. Strong winds carry salt and dust from the dry sea bed for hundreds of kilometres.\nHowever, there is some good news. In 2005 Kazakhstan completed the Kokaral Dam, which keeps the water in the northern part of the sea. Since then, the water level there has risen, and fish have returned. Fishermen are working again in several villages. The story of the Aral Sea shows how quickly people can damage nature — and how hard it is to repair it.","Why we need sleep\nMany people think that sleep is a waste of time. In fact, it is as important for our health as food and water.\nWhile we sleep, the body repairs itself. Muscles grow, and the immune system becomes stronger. The brain is also very busy at night: it sorts the information we received during the day and stores the most important things in our memory. That is why students who sleep well before an exam usually get better results than those who study all night.\nDoctors say that adults need between seven and nine hours of sleep every night, while teenagers need even more. Unfortunately, many people sleep less than six hours. A lack of sleep makes us tired and nervous. It is also dangerous: sleepy drivers cause thousands of road accidents every year.\nThere are several ways to sleep better. Go to bed and get up at the same time every day. Do not drink coffee in the evening. Switch off your phone and computer an hour before bedtime, because the light from screens tells the brain that it is still daytime. A dark, quiet and cool bedroom will also help you to fall asleep quickly.","The first skyscrapers\nAt the end of the nineteenth century, cities such as Chicago and New York were growing very fast. Land in the city centre was expensive, so architects began to build upwards.\nTwo inventions made tall buildings possible. The first was the safety lift. In 1854 Elisha Otis showed a lift that did not fall even if its cable broke. Without lifts, nobody wanted to live or work above the fifth floor. The second invention was the steel frame. In older buildings, thick walls carried the whole weight, so the walls on the ground floor had to be enormous. A steel frame carries the weight itself, and the walls can be thin and light.\nThe Home Insurance Building in Chicago, completed in 1885, is often called the first skyscraper. It had only ten floors, but it used a steel frame. People were afraid that it would fall down, yet it stood for more than forty years.\nSince then, buildings have become taller and taller. In 2010 the Burj Khalifa opened in Dubai. It is 828 metres high and has more than 160 floors. Engineers are already planning towers that will be a kilometre high.","Learning a foreign language\nThere are about seven thousand languages in the world, and it is believed that more than half of the world's population speaks at least two of them. Learning a foreign language is not only useful for travelling. It also trains the brain.\nScientists have found that people who speak two languages are often better at solving problems and doing several things at the same time. Some studies even suggest that bilingual people stay mentally active longer when they get old.\nMany adults believe that they are too old to learn a new language. This is not true. Children learn pronunciation more easily, but adults are better at understanding grammar rules and can organise their own learning.\nWhat is the best way to learn? Experts agree that regular practice is more important than talent. It is better to study for twenty minutes every day than for three hours once a week. It is also important not to be afraid of mistakes: everybody makes them, and they are a natural part of learning. Finally, use the language for things you enjoy — watch films, listen to songs or read about your hobby. Then learning will not feel like hard work.","Plastic in the ocean\nPlastic is cheap, light and strong, so we use it everywhere: in packaging, clothes, cars and phones. But these useful qualities have created a serious problem.\nPlastic does not disappear in nature. Scientists estimate that a plastic bottle may need about 450 years to break down. Every year millions of tonnes of plastic waste end up in rivers and seas. Sea animals and birds often eat small pieces of plastic because they look like food, and many of them die.\nThe sun and waves break plastic into very small pieces called microplastics. They are found in sea water, in fish and even in drinking water. Nobody knows yet how dangerous they are for people's health.\nWhat can be done? Many countries have already banned thin plastic bags. Shops offer paper or textile bags instead. Engineers are developing new materials that break down quickly. However, the simplest solution is in our own hands: we can use less plastic. A reusable bottle, a shopping bag made of cloth and a habit of sorting rubbish can make a real difference.","Abai Kunanbaiuly\nAbai Kunanbaiuly is the most famous Kazakh poet and thinker. He was born in 1845 in the Chingistau mountains in the east of Kazakhstan. His father was a rich and powerful man who wanted his son to become a leader of the people.\nAbai studied at a religious school in Semey and, at the same time, attended a Russian school. He loved reading and learned several languages. Thanks to books, he discovered the literature of both the East and the West.\nAbai wrote poems about nature, love, friendship and the life of ordinary people. He also composed songs, and many of them are still sung today. In addition, he translated the works of Russian poets, such as Pushkin and Lermontov, into Kazakh.\nHis most important prose work is the «Book of Words». It consists of forty-five short texts in which Abai thinks about education, honesty and hard work. He believed that knowledge and science were the only way to a better future, and he encouraged young people to study.\nAbai died in 1904, but his ideas are still important. There are monuments to him in many cities, and his books have been translated into many languages.","Smart homes\nImagine a house that knows when you wake up, makes your coffee and turns off the lights when you leave. Such houses already exist, and they are called smart homes.\nIn a smart home, devices are connected to the internet and to each other. The owner can control them with a phone or with voice commands. For example, you can switch on the heating on your way home, so the house is warm when you arrive. Sensors can notice smoke or a water leak and send a message to your phone immediately.\nSmart homes also help to save energy. The system turns off lights in empty rooms and lowers the temperature at night. As a result, electricity bills become smaller.\nHowever, there are some disadvantages. Smart devices are still quite expensive, and they do not always work well together. There is also the question of safety: if hackers get into the system, they can open the doors or watch people through cameras. That is why experts advise owners to use strong passwords and to update their devices regularly.\nIn spite of these problems, the number of smart homes is growing every year. In the future, they will probably become as common as mobile phones are today.","The Great Wall of China\nThe Great Wall of China is one of the most famous structures in the world. It is not a single wall but a system of walls and towers built over many centuries. Its total length is more than twenty thousand kilometres.\nThe first walls appeared more than two thousand years ago. Chinese rulers built them to protect the country from enemies who attacked from the north. Most of the wall that tourists visit today was built much later, during the Ming dynasty, between the fourteenth and seventeenth centuries.\nThe builders used the materials they could find nearby. In the mountains they used stone, and on the plains they used earth and bricks. Scientists have discovered that Ming builders added sticky rice to the mortar that held the bricks together. This made the mortar stronger and more resistant to water.\nMany people believe that the Great Wall can be seen from space with the naked eye. In fact, this is a myth: the wall is very long, but it is also narrow, so astronauts cannot easily see it.\nSince 1987 the Great Wall has been on the UNESCO World Heritage list. Millions of tourists visit it every year."],"site":true};</script>
<script>
'use strict';
const app=document.getElementById('app'),S=DATA.subjects,PSG=DATA.passages||[],QI={},TI={};
const T=[].concat(...S.map(s=>s.topics));
S.forEach(s=>{
  s.topics.forEach(t=>{t.SUB=s;t.all=[];
    t.sections.forEach(sec=>{sec.T=t;sec.q.forEach(q=>{q.S=sec;q.T=t;QI[q.i]=q;t.all.push(q.i)})});
    t.tids=(t.terms||[]).map(m=>{TI[m[0]]={i:m[0],term:m,T:t};return m[0]})});
  s.all=[].concat(...s.topics.map(t=>t.all));s.tids=[].concat(...s.topics.map(t=>t.tids));s.secs=[].concat(...s.topics.map(t=>t.sections))});
const ALLQ=[].concat(...S.map(s=>s.all)),ALLT=[].concat(...S.map(s=>s.tids)),SECS=[].concat(...S.map(s=>s.secs)),TERMS=[].concat(...T.map(t=>t.terms||[]));
const DAY0=Date.UTC(2026,0,1),EXAM=Date.UTC(2026,10,28),today=()=>Math.floor((Date.now()-DAY0)/864e5);
const getQ=id=>QI[id]||TI[id];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return m>10&&m<20?c:k===1?a:k>=2&&k<=4?b:c};
const nq=n=>n+' '+plural(n,'вопрос','вопроса','вопросов');
const fmt=s=>{s=Math.max(0,s|0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const bar=(m,n)=>`<div class="bar"><i style="width:${n?Math.round(m/n*100):0}%"></i></div>`;
const pct=(m,n)=>(n?Math.round(m/n*100):0)+'%';
const meter=(x,label)=>`<div class="meter"><div class="meter-top"><span>${label||'Освоено вопросов'}</span><b>${x.m} из ${x.n}</b></div>${bar(x.m,x.n)}</div>`;

/* progress: id -> [streak, wrong, attempts, day] */
const LS='m125-sm-quiz-v1',GAP=[1,3,7,14];let P={},syncState='local';
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LS));if(v&&typeof v==='object')P=v}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}
function save(){saveLocal();queueRemote();queueSy()}
/* настройки вида на этом устройстве: tr — показывать русский перевод объяснения */
const LSU='m125-quiz-ui';let UI={tr:false};
function loadUI(){try{const v=JSON.parse(localStorage.getItem(LSU));if(v&&typeof v==='object')UI.tr=!!v.tr}catch(e){}}
function saveUI(){try{localStorage.setItem(LSU,JSON.stringify(UI))}catch(e){}}
const rec=id=>P[id]||[0,0,0,0];
const isErr=id=>{const r=P[id];return !!r&&r[1]>0&&r[0]<2};
const isDue=id=>{const r=P[id];return !!r&&r[0]>=1&&today()-r[3]>=GAP[Math.min(r[0],4)-1]};
function st(ids){let m=0,e=0,a=0;for(const id of ids){const r=P[id];if(!r)continue;if(r[2])a++;if(r[0]>=1)m++;if(r[1]>0&&r[0]<2)e++}return{n:ids.length,m,e,a}}
function mark(id,ok){const r=rec(id).slice(0,4);r[2]++;r[3]=today();if(ok)r[0]=Math.min(9,r[0]+1);else{r[0]=0;r[1]++}P[id]=r;save()}

/* optional sync with the viewer's account (db capability); the page works without it */
let R=null,rDirty=false,rBusy=false,rTimer=0;
async function initRemote(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const ref=db.doc('data/users/'+uid+'/sm');
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    const body=snap&&snap.exists?snap.data():null,rp=body&&body.p&&typeof body.p==='object'?body.p:null;
    let changed=false,need=false;
    if(rp)for(const k in rp){const b=rp[k],a=P[k];if(!Array.isArray(b))continue;
      if(!a||b[2]>a[2]||(b[2]===a[2]&&b[3]>a[3])){P[k]=b.slice(0,4);changed=true}}
    for(const k in P){if(!rp||!Array.isArray(rp[k])||rp[k][2]<P[k][2]){need=true;break}}
    R=ref;syncState='cloud';
    if(changed)saveLocal();
    if(!run&&!view.done)render();
    if(need)queueRemote();
  }catch(e){}
}
function queueRemote(){if(!R)return;rDirty=true;clearTimeout(rTimer);rTimer=setTimeout(flushRemote,2500)}
async function flushRemote(){
  if(!R||rBusy||!rDirty)return;rBusy=true;rDirty=false;
  try{await R.set({v:1,t:Date.now(),p:JSON.parse(JSON.stringify(P))})}
  catch(e){const c=e&&e.code;if(c==='unavailable'||c==='resource_exhausted')rDirty=true;else{R=null;syncState='local'}}
  rBusy=false;if(rDirty&&R){clearTimeout(rTimer);rTimer=setTimeout(flushRemote,6000)}
}

/* ===== независимый сайт (DATA.site): общий прогресс через базу Firebase владельца, перенос файлом, работа без сети ===== */
const SITE=!!DATA.site,LSY='m125-sync';
let SY=null,syBusy=false,syDirty=false,syTimer=0,syMsg='',syNote='',syLast=0,syOpen=false,ioMsg='';
function loadSy(){try{const v=JSON.parse(localStorage.getItem(LSY));if(v&&typeof v.u==='string'&&typeof v.c==='string')SY={u:v.u,c:v.c,r:Number.isFinite(+v.r)?+v.r:-1}}catch(e){}}
function saveSy(){try{if(SY)localStorage.setItem(LSY,JSON.stringify(SY));else localStorage.removeItem(LSY)}catch(e){}}
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))};
const DBRE=/^(https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)|http:\/\/(127\.0\.0\.1|localhost):\d+)$/i;
const normDb=u=>{u=String(u||'').trim().replace(/\/+$/,'');return DBRE.test(u)?u:''};
function parseKey(s){try{s=String(s||'').trim();const i=s.indexOf('#sync=');if(i>=0)s=s.slice(i+6);if(!/^[\w-]{30,}$/.test(s))return null;
  const p=b64d(s).split('|'),u=normDb(p[0]);if(p.length===2&&u&&/^[a-z0-9]{20,64}$/.test(p[1]))return{u,c:p[1],r:-1}}catch(e){}return null}
function newCode(){const a=new Uint8Array(24);crypto.getRandomValues(a);return Array.from(a,x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join('')}
const syKey=()=>SY?b64e(SY.u+'|'+SY.c):'';
const syLink=()=>SY&&location.protocol!=='file:'?location.origin+location.pathname+'#sync='+syKey():'';
const syUrl=()=>SY.u+'/p/'+SY.c+'.json';
const syHttp=c=>c===401||c===403?'база не пускает (код '+c+'): проверьте, что правила вставлены и опубликованы':c===404?'база не найдена (код 404): проверьте адрес':'база ответила кодом '+c;
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function mergeP(rp){let ch=false;if(rp&&typeof rp==='object')for(const k in rp){const b=rp[k],a=P[k];if(!Array.isArray(b)||b.length<4)continue;
  if(!a||b[2]>a[2]||(b[2]===a[2]&&b[3]>a[3])){P[k]=b.slice(0,4).map(Number);ch=true}}return ch}
function syText(){return syBusy?'Сверяю с общей базой…':syMsg?'Не удалось сверить: '+syMsg+'. Ответы на этом устройстве сохранены, попробую ещё раз позже.'
  :syLast?'Сверено в '+hhmm(syLast)+'. Ответы уходят в общую базу сами.'+(syNote?' '+syNote:''):'Ещё не сверялось.'}
function paintSy(){const el=document.getElementById('systat');if(el){el.textContent=syText();el.className=syMsg&&!syBusy?'syerr':'systat'}}
/* эпоха сброса r: кто сбросил прогресс позже, тот прав; иначе записи объединяются по каждому вопросу */
async function sySync(){
  if(!SY)return;if(syBusy){syDirty=true;return}
  syBusy=true;syDirty=false;paintSy();let changed=false;const me=SY;
  try{
    const g=await fetch(syUrl(),{cache:'no-store'});if(!g.ok)throw new Error(syHttp(g.status));
    const d=await g.json();let rp=null,rr=0;
    if(d&&typeof d==='object'){rr=+d.r||0;if(typeof d.s==='string'){try{rp=JSON.parse(d.s)}catch(e){}}}
    if(SY!==me)throw new Error('ключ сменился');
    if(SY.r<0)SY.r=rr;                               /* устройство подключается впервые: объединяем, ничего не стираем */
    else if(rr>SY.r){P={};SY.r=rr;changed=true}      /* на другом устройстве прогресс сбросили позже */
    if(rr>=SY.r&&mergeP(rp))changed=true;
    let need=rr<SY.r;
    if(!need)for(const k in P){const b=rp&&rp[k];if(!Array.isArray(b)||b[2]<P[k][2]||(b[2]===P[k][2]&&b[3]<P[k][3])){need=true;break}}
    if(changed)saveLocal();
    if(need){const w=await fetch(syUrl(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:Date.now(),r:SY.r,s:JSON.stringify(P)})});
      if(!w.ok)throw new Error(syHttp(w.status))}
    syLast=Date.now();syMsg='';saveSy();
  }catch(e){syMsg=e&&e.message&&!/fetch|network|load/i.test(e.message)?e.message:'нет связи с базой'}
  syBusy=false;
  if(changed&&!run&&!view.done)render();else paintSy();
  if(syDirty)queueSy();
}
function queueSy(ms){if(!SY)return;clearTimeout(syTimer);syTimer=setTimeout(sySync,ms==null?2500:ms)}
function syEnable(v){
  const k=parseKey(v),u=k?'':normDb(v);syMsg='';syNote='';
  if(k)SY=k;else if(u)SY={u,c:newCode(),r:-1};
  else{syMsg='адрес не похож на базу Firebase. Он выглядит так: https://имя-проекта-default-rtdb.europe-west1.firebasedatabase.app';syOpen=true;render();return}
  saveSy();syLast=0;syOpen=true;render();sySync();
}
function exportP(){
  const d=new Date(),name='m125-progress-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
  const url=URL.createObjectURL(new Blob([JSON.stringify({app:'m125-quiz',v:1,t:Date.now(),p:P})],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  ioMsg='Файл «'+name+'» сохранён в загрузки. Ответов в нём: '+Object.keys(P).length+'.';syOpen=true;render();
}
async function importFile(f){
  if(!f)return;
  try{const d=JSON.parse(await f.text()),rp=d&&d.app==='m125-quiz'&&d.p&&typeof d.p==='object'?d.p:null;if(!rp)throw 0;
    const n0=Object.keys(P).length;if(mergeP(rp)){saveLocal();queueRemote();queueSy(300)}
    ioMsg='Файл загружен и объединён с прогрессом на этом устройстве: ответов было '+n0+', стало '+Object.keys(P).length+'.';
  }catch(e){ioMsg='Не получилось: это не файл прогресса квиза.'}
  syOpen=true;render();
}
function syBox(){
  const link=syLink();
  return `<details class="how" id="sybox" ${syOpen?'open':''}><summary>Общий прогресс на телефоне и компьютере${SY?' · включён':''}</summary><div class="sy">
    ${SY?`<p id="systat" class="${syMsg?'syerr':'systat'}">${esc(syText())}</p>
      ${link?`<label class="fld"><span>Ссылка для другого устройства: откройте её там один раз</span><input id="sylink" readonly value="${esc(link)}"></label>`:''}
      <label class="fld"><span>Ключ: его можно вставить на другом устройстве вместо ссылки</span><input id="sykey" readonly value="${esc(syKey())}"></label>
      <div class="actions"><button class="btn primary" data-act="sy-copy">Скопировать ${link?'ссылку':'ключ'}</button><button class="btn" data-act="sy-now">Сверить сейчас</button><button class="btn" data-act="sy-off">Отключить на этом устройстве</button></div>`
    :`<p>Чтобы телефон и компьютер вели один прогресс, вставьте сюда адрес вашей базы Firebase (как её создать, написано в инструкции) или ключ с другого устройства.</p>
      <label class="fld"><span>Адрес базы Firebase или ключ</span><input id="syin" placeholder="https://…firebasedatabase.app" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      ${syMsg?`<p class="syerr">Не получилось: ${esc(syMsg)}.</p>`:''}
      <div class="actions"><button class="btn primary" data-act="sy-on">Включить</button></div>`}
    <h3>Перенос файлом</h3>
    <p>Запасной способ без базы: сохраните прогресс в файл и загрузите его на другом устройстве. Прогресс объединяется, ничего не стирается.</p>
    <div class="actions"><button class="btn" data-act="io-save">Сохранить прогресс в файл</button><button class="btn" data-act="io-load">Загрузить из файла</button><input type="file" id="iofile" accept=".json,application/json" hidden></div>
    ${ioMsg?`<p class="systat">${esc(ioMsg)}</p>`:''}
  </div></details>`;
}
function initSite(){
  loadSy();
  const m=/^#sync=([\w-]+)$/.exec(location.hash);
  if(m){const k=parseKey(m[1]);if(k){if(!SY||SY.u!==k.u||SY.c!==k.c)SY=k;saveSy();syOpen=true}
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SY&&Date.now()-syLast>15000)sySync()});
  window.addEventListener('online',()=>{if(SY)sySync()});
  app.addEventListener('change',e=>{if(e.target&&e.target.id==='iofile'){importFile(e.target.files[0]);e.target.value=''}});
  app.addEventListener('toggle',e=>{if(e.target&&e.target.id==='sybox')syOpen=e.target.open},true);
  app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='syin'){e.preventDefault();syEnable(e.target.value)}});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* views */
let view={name:'home'},run=null,confirmReset=false,tick=0;
function setHash(h){try{if(location.hash.replace('#','')!==h)location.hash=h}catch(e){}}
function go(name,id){run=null;clearInterval(tick);view={name,id};confirmReset=false;setHash(name==='sub'?'pan-'+id:name==='topic'?'tema-'+id:'');render();window.scrollTo(0,0)}
function route(){const h=location.hash.replace('#','');let m;run=null;clearInterval(tick);
  if((m=/^tema-(\d+)$/.exec(h))&&T.find(t=>t.id===m[1]&&t.all.length))view={name:'topic',id:m[1]};
  else if((m=/^pan-([a-z]+)$/.exec(h))&&S.find(s=>s.id===m[1]))view={name:'sub',id:m[1]};
  else view={name:'home'};
  render()}
function render(){if(run)return renderQ();if(view.name==='topic')return topicView(T.find(t=>t.id===view.id));if(view.name==='sub')return subView(S.find(s=>s.id===view.id));home()}
const nextSec=secs=>secs.find(s=>s.q.some(q=>rec(q.i)[0]<1));
const contBtn=(ns,started,big)=>ns?`<button class="btn primary${big?' big':''}" data-act="cont" data-id="${ns.id}">${started?'Продолжить':'Начать'}: ${ns.T.n} · ${esc(ns.kz)}</button>`:'';

function home(){
  const x=st(ALLQ),all=ALLQ.concat(ALLT),errs=all.filter(isErr).length,dueN=all.filter(isDue).length,left=Math.ceil((EXAM-Date.now())/864e5);
  app.innerHTML=`
  <header class="hero">

  const m=q.term,dir=Math.random()<.5,used=new Set([m[1],m[3]]),others=[];
  for(const x of shuffle(q.T.terms).concat(shuffle(TERMS))){if(others.length>=4)break;if(used.has(x[1])||used.has(x[3]))continue;used.add(x[1]);used.add(x[3]);others.push(x)}
  const opts=dir?[{a:m[3],b:m[1],ok:true}].concat(others.map(x=>({a:x[3],b:x[1],ok:false})))
               :[{a:m[1],b:m[3],ok:true}].concat(others.map(x=>({a:x[1],b:x[3],ok:false})));
  return{stem:'«'+(dir?m[1]:m[3])+'»',sub:dir?'Орысша аудармасы қандай? · Как это по-русски?':'Қазақша қалай аталады? · Как это по-казахски?',ru:'',opts,
    exp:m[1]+' — '+m[3]+(m[2]?'. Другой вариант: '+m[2]+'.':'.'),tag:'Термин',multi:false,psg:''};
}
function showQ(){
  if(run.idx>=run.queue.length)return finish();

  if(q.term)c=termCard(q);

function settle(c,ok){
  if(!c.retry){run.first[c.id]=c.pts;if(ok)run.ok++;else{run.bad++;run.wrong.push(c.id)}if(c.multi){run.pts+=c.pts;run.max+=2}mark(c.id,ok)}

  const f=document.querySelector('.fb');
  if(f&&f.scrollIntoView)f.scrollIntoView({block:'nearest',behavior:window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function answer(i){const c=run.cur;if(!c||c.done||c.multi||!c.opts[i])return;c.pick=i;c.done=true;c.pts=c.opts[i].ok?2:0;settle(c,c.opts[i].ok)}
function toggle(i){const c=run.cur;if(!c||c.done||!c.multi||!c.opts[i])return;

    case'home':go('home');break;
    case'sub':go('sub',id);break;
    case'topic':go('topic',id);break;
    case'cont':runSec(id,true);break;
    case'run-sec':runSec(id);break;
    case'run-topic':startRun({title:t.n+' · вся тема',ids:t.all});break;
    case'run-left':startRun({title:t.n+' · неосвоенные',ids:t.all.filter(x=>rec(x)[0]<1)});break;
    case'run-terms':startRun({title:t.n+' · термины қаз ↔ рус',ids:shuffle(t.tids)});break;
    case'run-terr':startRun({title:t.n+' · ошибки темы',ids:shuffle(t.all.concat(t.tids).filter(isErr))});break;
    case'err':startRun({title:(s?s.kz+' · ':'')+'мои ошибки',ids:shuffle(pool(id).filter(isErr)),showTopic:true});break;
    case'due':startRun({title:(s?s.kz+' · ':'')+'повторение',ids:shuffle(pool(id).filter(isDue)).slice(0,40),showTopic:true});break;
    case'mix':startRun({title:s.kz+' · микс как в КТ',ids:mixIds(s),showTopic:true,requeue:false,limit:s.exam.min*60,kind:'mix',subId:s.id});break;
    case'ans':answer(+id);break;
    case'tog':toggle(+id);break;
    case'check':check();break;
    case'next':next();break;
    case'ru':run.cur.showRu=!run.cur.showRu;renderQ();break;
    case'hintn':run.cur.showN=true;renderQ();break;
    case'xtr':{UI.tr=!UI.tr;saveUI();const y=window.scrollY;
      if(run&&run.cur)renderQ(); /* фокус остаётся на «Дальше»: Enter сразу ведёт к следующему вопросу */
      else if(view.done){renderDone();const nb=app.querySelector('.xtr');if(nb)nb.focus({preventScroll:true})}
      window.scrollTo(0,y)}break;
    case'quit':{const k=run.o.back;go(k.name,k.id)}break;
    case'again':{const o=view.done.o;startRun(Object.assign({},o,{ids:o.kind==='mix'?mixIds(S.find(x=>x.id===o.subId)):o.kind==='sec'?o.ids:shuffle(o.ids)}))}break;
    case'again-wrong':startRun({title:view.done.title+' · ошибки',ids:view.done.wrong.slice(),back:view.done.o.back,showTopic:view.done.o.showTopic});break;
    case'back':{const k=view.done?view.done.o.back:{name:'home'};go(k.name,k.id)}break;
    case'reset':confirmReset=true;render();break;
    case'reset-no':confirmReset=false;render();break;
    case'reset-yes':P={};confirmReset=false;if(SY){SY.r=Date.now();saveSy()}save();render();break; /* SY.r — эпоха сброса для других устройств */
    case'sy-on':{const el=document.getElementById('syin');syEnable(el?el.value:'')}break;
    case'sy-now':syNote='';sySync();break;
    case'sy-off':SY=null;saveSy();syMsg='';syNote='';syLast=0;syOpen=true;render();break;
    case'sy-copy':{const el=document.getElementById(syLink()?'sylink':'sykey'),txt=el?el.value:'';
      const done=()=>{syNote='Скопировано: отправьте себе и откройте на другом устройстве.';paintSy()};
      const old=()=>{try{el.focus();el.select();document.execCommand('copy');done()}catch(e){}};
      if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,old);else old()}break;
    case'io-save':exportP();break;
    case'io-load':{const el=document.getElementById('iofile');if(el)el.click()}break;
  }
});
document.addEventListener('keydown',e=>{
  if(!run||!run.cur||e.ctrlKey||e.metaKey||e.altKey)return;
  const c=run.cur,onBtn=document.activeElement&&document.activeElement.tagName==='BUTTON';
  if(!c.done){
    const k='12345678'.indexOf(e.key);
    if(k>=0&&c.opts[k]){e.preventDefault();if(c.multi)toggle(k);else answer(k)}
    else if(e.key==='Enter'&&c.multi&&c.sel.size&&!(onBtn&&document.activeElement.id!=='checkbtn'&&!document.activeElement.classList.contains('opt'))){e.preventDefault();check()}
  }else if((e.key==='Enter'||e.key===' '||e.key==='ArrowRight')&&!(onBtn&&e.key!=='ArrowRight')){e.preventDefault();next()}
});
window.addEventListener('hashchange',route);
loadLocal();loadUI();if(SITE)initSite();route();initRemote();if(SITE&&SY)sySync();
</script>
</body>
</html>
